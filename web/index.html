/*MD-START*/
// ---- markdown ------------------------------------------------------------
//
// The harnesses answer in markdown; the console used to print the raw text, so
// an agent's **bold** arrived as asterisks. This is a small, dependency-free
// renderer for the transcript — the whole SPA is one embedded file with no
// build step and no network, so a library is not an option (a CDN would break
// the console for anyone running zori offline).
//
// Safety: text is HTML-escaped *first*, and only this renderer's own tags are
// ever introduced. Code spans and links are stashed behind sentinels while the
// remaining rules run, so no emphasis or autolink rule reaches inside them,
// and a URL is only made clickable for http(s)/mailto.

const MD = (() => {
  const FENCE = /^(\s*)(`{3,}|~{3,})[ \t]*([^\s`]*)[ \t]*$/;
  const HEAD = /^(#{1,6})[ \t]+(.*)$/;
  const HR = /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/;
  const ITEM = /^(\s*)([-*+]|\d{1,9}[.)])[ \t]+(.*)$/;
  const TASK = /^\[([ xX])\][ \t]+/;

  const esc = (s) => (s == null ? '' : String(s))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const indentOf = (l) => (l.match(/^[ \t]*/)[0] || '').length;

  // links and code spans are pulled out of the text and put back last, so the
  // other inline rules can never rewrite their insides
  function inline(text) {
    const keep = [];
    const stash = (html) => { keep.push(html); return '\u0000' + (keep.length - 1) + '\u0000'; };
    let s = esc(text).replace(/\u0000/g, '');

    s = s.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g,
      (m, ticks, code) => stash('<code>' + code.replace(/^ | $/g, '') + '</code>'));

    // an image is a link with its alt text: the console serves no assets, and
    // a remote <img> would simply fail to load for an offline operator
    const anchor = (label, url) => {
      const raw = url.replace(/&amp;/g, '&');
      if (!/^(https?:|mailto:)/i.test(raw)) return label;
      return stash('<a href="' + esc(raw) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>');
    };
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, url) => anchor(alt || url, url));
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, txt, url) => anchor(txt, url));

    s = s
      .replace(/\*\*\*(?=\S)([\s\S]*?\S)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^\w*])__(?=\S)([\s\S]*?\S)__(?![\w*])/g, '$1<strong>$2</strong>')
      .replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<del>$1</del>')
      .replace(/\*(?=\S)([^*\n]*?\S)\*/g, '<em>$1</em>')
      .replace(/(^|[^\w_])_(?=\S)([^_\n]*?\S)_(?![\w_])/g, '$1<em>$2</em>');

    // bare urls (markdown's own link form above is already stashed). The
    // sentinel `\u0000` is excluded from the url class: an adjacent code span
    // is stashed behind it just before this rule runs, and leaving NUL in the
    // class let a real code span abut a url and smuggle its internal marker
    // into the href (the marker is never re-restored once the anchor is stashed).
    s = s.replace(/(^|[\s(])((?:https?:\/\/|mailto:)[^\s<>"')\]\u0000]+)/g, (m, pre, url) => {
      const trail = /[.,;:!?]$/.test(url) ? url.slice(-1) : '';
      const href = trail ? url.slice(0, -1) : url;
      return pre + stash('<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + href + '</a>') + trail;
    });

    // a newline inside a paragraph is a line break the model actually typed
    s = s.replace(/\n/g, '<br>');
    return s.replace(/\u0000(\d+)\u0000/g, (m, i) => keep[+i] || '');
  }

  function splitRow(l) {
    return l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
  }
  function isTable(lines, i) {
    if (i + 1 >= lines.length || !lines[i].includes('|')) return false;
    if (/^ {0,3}>/.test(lines[i]) || FENCE.test(lines[i])) return false;
    const sep = splitRow(lines[i + 1]);
    return sep.length >= 1 && sep.every((c) => /^:?-{1,}:?$/.test(c));
  }
  function table(lines, i) {
    const head = splitRow(lines[i]);
    const align = splitRow(lines[i + 1]).map((c) =>
      c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : c.startsWith(':') ? 'left' : '');
    const al = (a) => (a ? ' style="text-align:' + a + '"' : '');
    const rows = [];
    let j = i + 2;
    while (j < lines.length && lines[j].trim() && lines[j].includes('|')) { rows.push(splitRow(lines[j])); j++; }
    let html = '<table><thead><tr>';
    head.forEach((c, k) => { html += '<th' + al(align[k]) + '>' + inline(c) + '</th>'; });
    html += '</tr></thead><tbody>';
    for (const r of rows) {
      html += '<tr>';
      head.forEach((_, k) => { html += '<td' + al(align[k]) + '>' + inline(r[k] == null ? '' : r[k]) + '</td>'; });
      html += '</tr>';
    }
    return [html + '</tbody></table>', j];
  }

  function listBlock(lines, start) {
    const rows = [];
    let i = start;
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) {                       // a blank line only ends the list
        let j = i;                               // when the next text is not part of it
        while (j < lines.length && !lines[j].trim()) j++;
        if (j < lines.length && (ITEM.test(lines[j]) || /^ {2,}\S/.test(lines[j]))) { i = j; continue; }
        break;
      }
      const m = ITEM.exec(line);
      if (m) { rows.push({ indent: m[1].length, item: true, ordered: /\d/.test(m[2]), text: m[3] }); i++; continue; }
      if (/^ {2,}\S/.test(line) && rows.length) { rows.push({ indent: indentOf(line), item: false, text: line.trim() }); i++; continue; }
      break;
    }
    return [renderList(rows), i];
  }

  function renderList(rows) {
    if (!rows.length) return '';
    const base = rows[0].indent;
    const ordered = rows[0].ordered;
    let out = '';
    let i = 0;
    while (i < rows.length) {
      if (rows[i].indent < base) break;
      if (rows[i].indent > base) { out += '<li>' + renderList(rows.slice(i)) + '</li>'; break; }
      const content = [rows[i].text];
      i++;
      const inner = [];
      while (i < rows.length && rows[i].indent > base) { inner.push(rows[i]); i++; }
      let innerHtml = '';
      if (inner.length && inner[0].item) innerHtml = renderList(inner);
      else for (const r of inner) content.push(r.text);
      let task = '';
      content[0] = content[0].replace(TASK, (m, box) => { task = box.toLowerCase(); return ''; });
      const body = blocks(content.join('\n')).replace(/^<p>(?:(?!<\/p>)[\s\S])*<\/p>$/, (m) => m.slice(3, -4));
      out += task === ''
        ? '<li>' + body + innerHtml + '</li>'
        : '<li class="md-task"><span class="md-box">' + (task === 'x' ? '☑' : '☐') + '</span> ' + body + innerHtml + '</li>';
    }
    return '<' + (ordered ? 'ol' : 'ul') + '>' + out + '</' + (ordered ? 'ol' : 'ul') + '>';
  }

  function blocks(text) {
    const lines = text.replace(/\r\n?/g, '\n').split('\n');
    let out = '', para = [], fence = null, fenceLang = '', fenceBody = [];
    const flush = () => { if (para.length) { out += '<p>' + inline(para.join('\n')) + '</p>'; para = []; } };
    const code = () => '<pre' + (fenceLang ? ' data-lang="' + esc(fenceLang) + '"' : '') +
      '><code>' + esc(fenceBody.join('\n')) + '</code></pre>';
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (fence !== null) {
        const e = FENCE.exec(line);
        if (e && e[2][0] === fence[0] && e[2].length >= fence.length) { out += code(); fence = null; fenceLang = ''; fenceBody = []; }
        else fenceBody.push(line);
        continue;
      }
      const f = FENCE.exec(line);
      if (f) { flush(); fence = f[2]; fenceLang = f[3] || ''; fenceBody = []; continue; }
      if (!line.trim()) { flush(); continue; }
      if (HR.test(line)) { flush(); out += '<hr>'; continue; }
      const h = HEAD.exec(line);
      if (h) { flush(); out += '<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'; continue; }
      if (/^ {0,3}>/.test(line)) {
        flush();
        const body = [];
        while (i < lines.length && /^ {0,3}>/.test(lines[i])) { body.push(lines[i].replace(/^ {0,3}> ?/, '')); i++; }
        out += '<blockquote>' + blocks(body.join('\n')) + '</blockquote>';
        i--; continue;
      }
      if (isTable(lines, i)) { const [html, next] = table(lines, i); out += html; i = next - 1; continue; }
      if (ITEM.test(line)) { const [html, next] = listBlock(lines, i); out += html; i = next - 1; continue; }
      para.push(line);
    }
    if (fence !== null) out += code();          // unterminated fence: still show the code
    flush();
    return out;
  }

  return {
    render(text) {
      const t = text == null ? '' : String(text);
      if (!t.trim()) return '';
      return '<div class="md">' + blocks(t) + '</div>';
    },
  };
})();
/*MD-END*/

// ---- helpers -------------------------------------------------------------
function statusColor(s) {
  return ({ completed:'var(--done)', failed:'var(--failed)', running:'var(--running)' }[s]) || 'var(--muted)';
}
function labelFor(s) {
  return ({ pending:'pending', running:'running', done:'done', failed:'failed', skipped:'skipped', stale:'stale', waiting:'waiting' }[s]) || s;
}
function escapeHtml(s) {
  return (s == null ? '' : String(s))
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
let noteT = null;
function note(msg) { const el = $('#bstatus'); el.textContent = msg; clearTimeout(noteT); noteT = setTimeout(()=>{ renderPreview(); }, 4000); }

// ---- the canvas spec -----------------------------------------------------
//
// The browser holds a raw `Flow` mirror (spec.current) — the exact JSON shape
// the server parses — so opening a saved flow round-trips fields the editor
// has no widget for (args/env/cwd). Validation, YAML writing and the
// execution levels all come from the server (the runner's own code path);
// this side only renders.

const HARNESS = { list: [], byId: {} };
// The skill store as the server sees it (built-ins + project + global). The
// node config strip and the start-chat picker both render from this; it is
// fetched once at boot like HARNESS. A name not in this list can still be a
// flow's skills_dirs skill — the runner resolves those at run time — so the
// picker is a convenience, not the authority on what is valid.
const SKILLS = { list: [] };
let bTimer = null;

function blankTask(id, harness) {
  return { id, harness: harness || 'coddy', model: null, in: '', out: null,
           depends_on: [], optional: false, cwd: null };
}
function blankSpec() {
  return { name: '', cwd: null, default_timeout_secs: null,
           inputs: {}, tasks: [ blankTask('draft') ] };
}
const spec = { current: blankSpec(), dirty: false, levels: null, error: null, yaml: '', pending: false, warnings: [], fromRunFile: false };

function slugify(s) { return (s || '').trim().toLowerCase().replace(/[^a-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '') || 'flow'; }

// -- meta fields --
// (default_timeout_secs has no live widget anymore — a loaded flow keeps its
// value through the spec mirror, so the top bar stays minimal)
function readMeta() {
  const s = spec.current;
  s.name = $('#bf-name').value;
  const cwd = $('#bf-cwd').value.trim(); s.cwd = cwd || null;
  s.inputs = parseInputs($('#bf-inputs').value);
}

// Inputs textarea -> {key: value}. The key is everything before the FIRST '=',
// so any script works (latin, cyrillic, …) — the old `[\w.-]+` match silently
// dropped non-latin keys. A line without '=' continues the previous key's
// value, so a multi-line prompt (the shape a research topic actually takes)
// survives instead of vanishing. A line with no preceding key is genuine
// garbage: it is dropped but reported via parseInputs.bad(), and Save refuses
// while any remain — a silently-empty inputs block was exactly the bug that
// booted a flow whose ${inputs.*} resolved to nothing.
function parseInputs(text) {
  const out = {}; const bad = []; let last = null;
  for (const line of (text || '').split('\n')) {
    if (!line.trim()) continue;
    const i = line.indexOf('=');
    if (i < 0) {
      if (last !== null) out[last] += '\n' + line;      // continuation line
      else bad.push(line.trim());
      continue;
    }
    const k = line.slice(0, i).trim(), v = line.slice(i + 1);
    if (!k) { if (last !== null) out[last] += '\n' + line; else bad.push(line.trim()); continue; }
    out[k] = v; last = k;
  }
  parseInputs.bad = bad;
  return out;
}

// True when the textarea text already expresses `inputs` (compared by
// re-parsing, so formatting differences like a multi-line value are not
// treated as a change). renderBuilder rewrites the box only when they differ:
// a programmatic load (open saved / new flow) rewrites it, a structural
// re-render (+Task, delete) does not — otherwise a line the parser rejected
// would be erased before Save could gate on it.
function sameInputs(text, inputs) {
  const a = parseInputs(text), b = inputs || {};
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every(k => a[k] === b[k]);
}

// ---- the graph layout ----------------------------------------------------
//
// There is ONE layout mode: left-to-right columns, one column per execution
// level — the shape the runner actually executes, and the Airflow-like graph
// the console is meant to show. There is no separate edit-mode layout; the old
// vertical one lived in the card-graph view that was deleted with the Run/Build
// merge. What kept re-appearing as a "vertical mode" was this function: it took
// column numbers from `spec.levels`, which only arrives with the server's
// /validate answer, so a freshly opened or attached flow (no plan yet) dropped
// every block into column 0 — one vertical pile. And because positions are
// saved into the YAML, that pile then stuck.
//
// So the levels are computed here too, by the same Kahn BFS as
// src/dag.rs::build_plan (its tests in src/dag.rs are the contract this mirrors):
// the graph is horizontal the moment it is drawn, with no round trip to the
// server. The server's plan remains the *authority* on validity — if the two
// ever disagree, save/boot reject the flow — it is simply no longer what
// positions the blocks, because waiting for it is exactly what produced the
// pile. A flow that cannot be layered at all (a cycle, reported in the status
// line) spreads left-to-right in flow order rather than stacking.
//
// The DOM-free core sits between the LAYOUT markers below and is exercised by
// `node web/layout.test.mjs`, which slices it out of this file — so the test
// can never drift from what ships.

/*LAYOUT-START*/
// The DOM-free core of the layout: tasks in, columns out. Pure on purpose, so
// `node web/layout.test.mjs` can exercise it against src/dag.rs::build_plan.

// Grid geometry: one column per level, left to right. A column is STEP_X wide
// for a NODE_W-wide block and a row STEP_Y tall — the slack is where the edges run.
const GRID_X = 40, GRID_Y = 40, STEP_X = 240, STEP_Y = 120;

// Mirror of the server's ref→dep merge. Authoritative validation happens on
// the server; if these ever disagree, save/boot reject with a clear error
// rather than writing a bad flow.
function refsIn(text) {
  const out = []; let rest = text || '';
  while (true) {
    const i = rest.indexOf('${steps.'); if (i < 0) break;
    rest = rest.slice(i + 8);
    const j = rest.indexOf('}'); if (j < 0) break;
    const key = rest.slice(0, j); rest = rest.slice(j + 1);
    if (key.endsWith('.output')) { const id = key.slice(0, -7); if (id && !out.includes(id)) out.push(id); }
  }
  return out;
}
function effDeps(t) {
  const deps = (t.depends_on || []).slice();
  for (const r of refsIn(t.in).concat(refsIn(t.out))) if (!deps.includes(r)) deps.push(r);
  return deps;
}

// Kahn BFS over the tasks, mirroring src/dag.rs::build_plan: level 0 waits for
// nothing, level n+1 waits for the last of its dependencies in level n. Ids
// keep flow order inside a level, so the layout is stable across renders.
// Two deliberate divergences from build_plan, both about what LAYOUT should do
// with a flow that is not yet legal (it is /validate that adjudicates, and the
// status line that reports):
//  - an unknown dependency is ignored, not fatal, so a typo or a not-yet-named
//    block does not collapse the graph while the operator types it. Unknown
//    deps are still rejected at save/boot, as build_plan demands.
//  - ids keep flow order inside a level (build_plan sorts them): the column
//    then matches the YAML and stays put across renders. The chips in the YAML
//    tab show the server's sorted plan, so nothing hides the real order.
// A task on itself IS treated as a cycle, as in build_plan's self_cycle: the
// canvas must not go on looking healthy about a flow the runner will refuse.
function levelsOf(tasks) {
  const ids = [];
  const seen = new Set();
  for (const t of tasks) {
    const id = (t.id || '').trim();
    if (id && !seen.has(id)) { seen.add(id); ids.push(id); }
  }
  const inc = {}, indeg = {};
  for (const id of ids) { inc[id] = []; indeg[id] = 0; }
  for (const t of tasks) {
    const id = (t.id || '').trim(); if (!id) continue;
    for (const d of effDeps(t)) {
      // a self-edge counts: depending on oneself is a cycle, not a no-op
      if (!seen.has(d) || inc[d].includes(id)) continue;                // unknown/dup
      inc[d].push(id); indeg[id]++;
    }
  }
  const out = [];
  let level = ids.filter(id => indeg[id] === 0);
  let placed = level.length;
  while (level.length) {
    out.push(level);
    const next = [];
    for (const id of level) for (const m of inc[id]) if (--indeg[m] === 0) next.push(m);
    level = next; placed += level.length;
  }
  return placed === ids.length ? out : null;
}

// The fingerprint of the old fallback's output: every placed block sitting on
// one column of the generator's grid. Blocks saved while it was live are what
// reads as a "vertical graph" — a block the operator dragged anywhere is not
// on that grid, so this only ever matches what the code itself emitted.
function isLegacyPile(tasks) {
  const placed = tasks.filter(t => t.pos && Number.isFinite(t.pos.x) && Number.isFinite(t.pos.y));
  if (placed.length < 2) return false;
  return placed.every(t => t.pos.x === GRID_X
    && t.pos.y >= GRID_Y && (t.pos.y - GRID_Y) % STEP_Y === 0);
}

// Put tasks on the grid, left to right by level. A task that already has a
// position keeps it — the operator's drags are authoritative — with one
// exception: when the WHOLE flow is the legacy pile, which is re-derived so
// files saved during the bug stop coming back vertical. Returns the id→column
// map, mostly so the test can assert on it.
function placeBlocks(tasks) {
  const levels = levelsOf(tasks);
  // No layering (a cycle; /validate reports it in the status line) still reads
  // left-to-right, in flow order: a vertical pile is never the right answer.
  const rows = levels || tasks.map(t => { const id = (t.id || '').trim(); return id ? [id] : []; });
  const col = {};
  rows.forEach((ids, li) => ids.forEach(id => { if (!(id in col)) col[id] = li; }));
  const redo = isLegacyPile(tasks);
  const seen = {};
  for (const t of tasks) {
    const placed = t.pos && Number.isFinite(t.pos.x) && Number.isFinite(t.pos.y);
    if (placed && !redo) continue;
    const c = (t.id in col) ? col[t.id] : 0;
    seen[c] = (seen[c] || 0);
    t.pos = { x: GRID_X + c * STEP_X, y: GRID_Y + seen[c] * STEP_Y };
    seen[c]++;
  }
  return col;
}
/*LAYOUT-END*/

// ---- the canvas (Visio-style) ------------------------------------------
//
// The canvas is an infinite plane under the whole UI — the `view` transform
// above owns it: it fills the strip edge to edge, the inspector floats on
// top of it (Airflow-style), and nothing the panel does ever re-flows the
// graph. Drag the empty background to pan the plane; the wheel zooms around
// the cursor; ⤢ fits every block into the visible strip. Every task is a
// block at spec pos {x,y} in plane coordinates. Drag a block to move it (the
// drag divides by zoom, so the block sticks to the cursor); click a block
// (without dragging) to select it into the right panel's chat; the selected
// block is panned into the strip the panel leaves visible. On hover (and
// while selected) each block shows three round action buttons: ✕ in the
// top-right corner deletes it, ＋ on the right edge grows a block that
// DEPENDS on this one (to the right), ⧉ at the bottom duplicates it below
// (same dependencies, so the same stage). Positions are
// stored on each task (Flow.pos) so a flow reopens with its layout; a task
// with no pos gets an auto one from its level, and the first manual drag pins
// it.
let selId = null;
let editTask = null;
let editEl = null;
let editIndex = -1;
const NODE_W = 184;

const canvas = $('#bcanvas');
const edgeSvg = $('#bedges');
const wrap = $('#bcanvas-wrap');

// ---- viewport: an infinite plane, moved by a transform --------------------
//
// The graph is not a scroll region — it is a plane. `view` holds the pan
// offset (screen px) and the zoom factor; applyView() writes both into one
// `translate() scale()` transform on #bcanvas and keeps the dot grid (the
// wrap's background) in lockstep, so the whole world moves together: drag
// the background to pan (canvasPan below), wheel to zoom around the cursor
// (Airflow-style, no modifier). No native scrolling anywhere — which is also
// why this works identically in every browser: no scrollbars, no capture
// requirements, just pointer events on window.
const view = { x: 0, y: 0, k: 1 };
const ZMIN = 0.25, ZMAX = 2.5;
function applyView() {
  canvas.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
  const g = 26 * view.k;
  wrap.style.backgroundSize = `${g}px ${g}px`;
  wrap.style.backgroundPosition = `${view.x}px ${view.y}px`;
  const lvl = $('#zoom-lvl');
  if (lvl) lvl.textContent = Math.round(view.k * 100) + '%';
}
// Zoom by `factor`, keeping the graph point under (mx,my) — wrap-relative
// screen coords — fixed on screen. This is what makes wheel zoom feel right.
function zoomAt(mx, my, factor) {
  const k2 = Math.min(ZMAX, Math.max(ZMIN, view.k * factor));
  const r = k2 / view.k;
  view.x = mx - (mx - view.x) * r;
  view.y = my - (my - view.y) * r;
  view.k = k2;
  applyView();
}
// Fit every block into the strip the panel leaves visible (the graph never
// hides behind the panel on load). Capped at k=1 — fitting a lone draft block
// should not blow it up to 250%.
function fitView() {
  const ts = spec.current.tasks;
  if (!ts.length) { view.x = 24; view.y = 24; view.k = 1; applyView(); return; }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const t of ts) {
    const el = elFor(t.id);
    const w = el ? el.offsetWidth : 184, h = el ? el.offsetHeight : 62;
    minX = Math.min(minX, t.pos.x); minY = Math.min(minY, t.pos.y);
    maxX = Math.max(maxX, t.pos.x + w); maxY = Math.max(maxY, t.pos.y + h);
  }
  const pad = 24;
  const freeW = Math.max(wrap.clientWidth - $('#inspector').offsetWidth - pad * 2, 140);
  const freeH = wrap.clientHeight - pad * 2;
  const bw = maxX - minX, bh = maxY - minY;
  const k = Math.min(1, Math.max(ZMIN, Math.min(freeW / Math.max(bw, 1), freeH / Math.max(bh, 1))));
  view.k = k;
  view.x = (freeW - bw * k) / 2 + pad - minX * k;
  view.y = (freeH - bh * k) / 2 + pad - minY * k;
  applyView();
}

function nodeById(id) {
  return spec.current.tasks.find(t => (t.id || '').trim() === id);
}
function elFor(id) {
  return canvas.querySelector(`.bnode[data-id="${CSS.escape(id)}"]`);
}

// Position any task that lacks one, one column per execution level. The levels
// come from this file's own Kahn BFS (see the layout section above), so a flow
// is horizontal the moment it loads — never from the server's plan, which is
// what made a freshly opened flow collapse into a vertical pile.
function assignAutoPositions() {
  placeBlocks(spec.current.tasks);
}

// The first grid cell at/after (x,y) that no existing block already covers.
function findFreeSpot(x, y) {
  const taken = spec.current.tasks.filter(t => t.pos).map(t => t.pos);
  const clash = (px, py) => taken.some(p => Math.abs(p.x - px) < 40 && Math.abs(p.y - py) < 96);
  let px = x, py = y;
  while (clash(px, py)) py += 120;
  return { x: px, y: py };
}

function newId(base) {
  const ids = new Set(spec.current.tasks.map(t => (t.id || '').trim()));
  let n = 1, id = base + n;
  while (ids.has(id)) { n++; id = base + n; }
  return id;
}

// Grow a new block from `from`: dir 'dep' → depends on it (to the right),
// dir 'par' → a parallel sibling (below, same deps). Then open its settings.
function growFrom(from, dir) {
  readMeta();
  const base = ((from.id || 'task').trim() || 'task');
  const t = blankTask(dir === 'dep' ? newId(base + '-') : newId('task-'));
  if (dir === 'dep') {
    t.depends_on = [from.id];
    t.pos = findFreeSpot(from.pos.x + 240, from.pos.y);
  } else {
    t.depends_on = (from.depends_on || []).slice();
    t.pos = findFreeSpot(from.pos.x, from.pos.y + 120);
  }
  spec.current.tasks.push(t);
  renderBuilder();
  openEditor(t);
}

// Duplicate a block: an exact copy (harness, model, prompt, out, deps, cwd)
// placed below the original — same dependencies, so it lands in the same
// execution level, which is what a duplicate means on this canvas.
function duplicateTask(t) {
  readMeta();
  const copy = JSON.parse(JSON.stringify(t));
  copy.id = newId(((t.id || 'task').trim() || 'task') + '-copy');
  copy.pos = findFreeSpot(t.pos.x, t.pos.y + 120);
  // A copy is a fresh block: it must not inherit the original's supermodel
  // chat, or two blocks would reopen the same dialogue.
  copy.chat = null;
  spec.current.tasks.push(copy);
  renderBuilder();
  openEditor(copy);
}

// A free block anywhere: the ＋ button drops it near the origin, growing
// downward past whatever is already there. kind 'prompt' pre-selects the
// prompt harness — a starter block with no process behind it.
function addFreeBlock(kind) {
  readMeta();
  const prompt = kind === 'prompt';
  const t = blankTask(newId(prompt ? 'prompt-' : 'task-'), prompt ? 'prompt' : null);
  t.pos = findFreeSpot(40, 40);
  spec.current.tasks.push(t);
  renderBuilder();
  openEditor(t);
}

// A block that carries a supermodel chat is marked with a 💬, so the operator
// sees at a glance which node holds a live dialogue (clicking it reopens it).
function setChatBadge(el, has) {
  let b = el.querySelector('.bn-chat');
  if (has && !b) {
    b = document.createElement('span');
    b.className = 'bn-chat'; b.textContent = '💬';
    b.title = 'У этого блока есть чат с надмоделью — кликни по блоку, чтобы открыть';
    el.appendChild(b);
  } else if (!has && b) b.remove();
}

function nodeEl(t, i) {
  const el = document.createElement('div');
  const id = (t.id || '').trim();
  el.className = 'bnode' + (id ? '' : ' empty') + (t.id === selId ? ' sel' : '');
  el.dataset.id = t.id;
  el.style.left = (t.pos?.x ?? 40) + 'px';
  el.style.top = (t.pos?.y ?? 40) + 'px';
  el.style.width = NODE_W + 'px';
  const modelBit = t.model ? ' · ' + escapeHtml(t.model) : '';
  const preview = (t.in || '').trim().replace(/\s+/g, ' ');
  el.innerHTML =
    `<div class="bn-id">${escapeHtml(id || 'новый блок')}</div>` +
    `<div class="bn-sub">${escapeHtml(t.harness || '')}${modelBit}</div>` +
    (preview ? `<div class="bn-in">${escapeHtml(preview.slice(0, 90))}</div>` : '') +
    `<button class="bn-act bn-run" data-act="run" title="Запустить / перезапустить этот блок (и его зависимости)" aria-label="Запустить блок">▶</button>` +
    `<button class="bn-act bn-del" data-act="del" title="Удалить блок" aria-label="Удалить блок">✕</button>` +
    `<button class="bn-act bn-add" data-act="dep" title="Добавить блок, зависимый от этого" aria-label="Добавить зависимый блок">＋</button>` +
    `<button class="bn-act bn-dup" data-act="dup" title="Дублировать блок (тот же stage)" aria-label="Дублировать блок">⧉</button>`;
  setChatBadge(el, !!t.chat);   // 💬 marks a block that carries its own dialogue
  // action buttons must not trigger the drag-or-click handler; a plain
  // click on the block itself opens its chat (prompt card + dialogue)
  for (const b of el.querySelectorAll('.bn-act')) {
    b.addEventListener('pointerdown', e => e.stopPropagation());
    b.addEventListener('click', e => {
      e.stopPropagation();
      const act = b.dataset.act;
      if (act === 'del') deleteTask(t);
      else if (act === 'dup') duplicateTask(t);
      else if (act === 'run') runNode(t);
      else growFrom(t, act);
    });
  }
  wireDrag(el, t);
  return el;
}

// Distinguish a click (open settings) from a drag (move). Pointer capture keeps
// the drag alive when the cursor leaves the block.
function wireDrag(el, t) {
  let down = null;
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    down = { mx: e.clientX, my: e.clientY, ox: t.pos.x, oy: t.pos.y, moved: false };
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - down.mx, dy = e.clientY - down.my;
    if (!down.moved && Math.hypot(dx, dy) > 4) { down.moved = true; el.classList.add('dragging'); }
    if (down.moved) {
      // dx/dy are screen pixels; the plane may be zoomed, so move the block
      // by dx/k in graph coordinates to keep it exactly under the cursor.
      // No clamp at 0: the plane is infinite in every direction, so blocks
      // may live at negative coordinates — above and left of where the first
      // auto-placed one sits (the owner's report: the workspace felt boxed
      // in). fitView/revealNode work off the content bbox, drawEdges sizes its
      // SVG to the bbox too, and TaskPos is f64 — negatives round-trip.
      t.pos = { x: Math.round(down.ox + dx / view.k), y: Math.round(down.oy + dy / view.k) };
      el.style.left = t.pos.x + 'px'; el.style.top = t.pos.y + 'px';
      drawEdges();
    }
  });
  const finish = e => {
    if (!down) return;
    const wasDrag = down.moved;
    down = null;
    el.classList.remove('dragging');
    if (wasDrag) { spec.dirty = true; validateSoon(300); }   // persist the new layout
    // A plain click opens the block: its own supermodel chat if it carries one
    // (openEditor reopens the dialogue bound to it), else its config. Navigating
    // is safe now — a chat is bound to its node, so leaving it only detaches it;
    // clicking that node again brings the same dialogue back with its transcript.
    else { selectTask(t.id); openEditor(t); }
  };
  el.addEventListener('pointerup', finish);
  el.addEventListener('pointercancel', () => { down = null; el.classList.remove('dragging'); });
}

// The panel floats over the canvas's right side, so a selected block must be
// brought into the *visible* strip — otherwise a far-right block opens its
// chat from under the panel (Airflow never covers the node you clicked).
// Plane arithmetic: the block's screen box is pos*k + pan; shift the pan.
function revealNode(id) {
  const el = elFor(id); if (!el) return;
  const pad = 24;
  const freeW = Math.max(wrap.clientWidth - $('#inspector').offsetWidth - pad, 160);
  const x0 = el.offsetLeft * view.k + view.x, x1 = x0 + el.offsetWidth * view.k;
  if (x1 > freeW) view.x -= x1 - freeW;
  else if (x0 < pad) view.x += pad - x0;
  const y0 = el.offsetTop * view.k + view.y, y1 = y0 + el.offsetHeight * view.k;
  if (y1 > wrap.clientHeight - pad) view.y -= y1 - (wrap.clientHeight - pad);
  else if (y0 < pad) view.y += pad - y0;
  applyView();
}

function selectTask(id) {
  selId = id;
  for (const n of canvas.querySelectorAll('.bnode')) n.classList.toggle('sel', n.dataset.id === id);
  if (id) revealNode(id);
}

function deleteTask(t) {
  const id = (t.id || '').trim();
  const i = spec.current.tasks.indexOf(t);
  if (i < 0) return;
  spec.current.tasks.splice(i, 1);
  // Drop the deleted id from the others' explicit deps, so removing a block
  // does not leave a dangling dependency the server would reject. (${steps.…}
  // still written into prompts is left as-is: it surfaces as a clear server
  // error naming the missing id, which is honest rather than silently rewritten.)
  if (id) for (const o of spec.current.tasks)
    if (o.depends_on) o.depends_on = o.depends_on.filter(d => d !== id);
  // If the deleted block was open in the inspector, drop the selection (the
  // panel returns to its empty-chat resting state) and collapse the config.
  if (editTask === t) { editTask = null; editIndex = -1; editEl = null; renderRunSection(); setCfg(false); }
  if (selId === id) selId = null;
  renderBuilder();
}

function renderCanvas() {
  assignAutoPositions();
  for (const n of canvas.querySelectorAll('.bnode')) n.remove();
  spec.current.tasks.forEach((t, i) => canvas.appendChild(nodeEl(t, i)));
  drawEdges();
  overlayRun();   // freshly built blocks inherit the attached run's status
}

// Bezier edges from every dependency (explicit + auto-wired from ${steps…}).
// The SVG is sized and positioned to the content's bounding box — blocks may
// live at negative plane coordinates (the plane is infinite; drags are not
// clamped), and an SVG clips at its own viewport, so anchoring it at (0,0)
// would silently cut every edge that runs into the negatives.
function drawEdges() {
  const PAD = 120;
  let minX = 0, minY = 0, maxX = 0, maxY = 0;
  let any = false;
  const box = {};
  for (const t of spec.current.tasks) {
    const el = elFor(t.id); if (!el) continue;
    const w = el.offsetWidth, h = el.offsetHeight;
    const b = { x: t.pos.x, y: t.pos.y, w, h };
    box[(t.id || '').trim()] = b;
    if (!any) { minX = b.x; minY = b.y; maxX = b.x + w; maxY = b.y + h; any = true; }
    else {
      minX = Math.min(minX, b.x); minY = Math.min(minY, b.y);
      maxX = Math.max(maxX, b.x + w); maxY = Math.max(maxY, b.y + h);
    }
  }
  // content-only: the wrap never scrolls, the plane is transformed
  const W = maxX - minX + PAD * 2, H = maxY - minY + PAD * 2;
  canvas.style.width = Math.max(W, 120) + 'px'; canvas.style.height = Math.max(H, 120) + 'px';
  // the canvas box keeps its origin at the plane's (0,0) (blocks position
  // themselves in plane coords, overflow is visible), so the SVG must offset
  // itself to the bbox origin instead
  edgeSvg.style.left = (minX - PAD) + 'px';
  edgeSvg.style.top = (minY - PAD) + 'px';
  edgeSvg.setAttribute('width', W); edgeSvg.setAttribute('height', H);
  edgeSvg.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';
  const defs = document.createElementNS(ns, 'defs');
  defs.innerHTML = '<marker id="barrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a7bd5"/></marker>';
  edgeSvg.appendChild(defs);
  // paths are drawn in the SVG's own coords: the plane origin maps to the
  // pad, so subtract the bbox origin (shift) from every point
  const sx = minX - PAD, sy = minY - PAD;
  for (const t of spec.current.tasks) {
    const to = box[(t.id || '').trim()]; if (!to) continue;
    for (const dep of effDeps(t)) {
      const from = box[dep]; if (!from) continue;
      const x1 = from.x + from.w - sx, y1 = from.y + from.h / 2 - sy,
            x2 = to.x - sx, y2 = to.y + to.h / 2 - sy, mx = (x1 + x2) / 2;
      const p = document.createElementNS(ns, 'path');
      p.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
      p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#3a7bd5'); p.setAttribute('stroke-width', '1.5');
      p.setAttribute('marker-end', 'url(#barrow)'); edgeSvg.appendChild(p);
    }
  }
}

function renderBuilder(fromSpec) {
  // fromSpec=true on programmatic loads (open saved / attach a run / New):
  // readMeta() pulls the meta bar from the DOM, which still holds the previous
  // draft, and would overwrite the flow we just loaded. Interactive callers
  // omit it so freshly typed meta is kept.
  if (!fromSpec) readMeta();
  const s = spec.current;
  $('#bf-name').value = s.name || '';
  $('#bf-cwd').value = s.cwd || '';
  // Only rewrite the Inputs box when it disagrees with the spec (a programmatic
  // load: open saved / new flow). Rewriting it on every re-render would erase a
  // line the parser rejected, and the save gate would then no longer see it.
  const ta = $('#bf-inputs');
  if (!sameInputs(ta.value, s.inputs)) {
    ta.value = Object.entries(s.inputs || {}).map(([k, v]) => `${k}=${v}`).join('\n');
  }
  renderCanvas();
  if (fromSpec) fitView();   // a loaded flow fits the visible strip — never opens hidden behind the panel
  renderPreview();
}

function renderPreview() {
  const lv = $('#blevels'); lv.innerHTML = '';
  if (spec.levels) {
    spec.levels.forEach((ids, li) => {
      const col = document.createElement('span'); col.className = 'lv';
      col.appendChild(document.createTextNode('L' + li + ': '));
      ids.forEach(id => { const c = document.createElement('span'); c.className = 'chip'; c.textContent = id; col.appendChild(c); });
      lv.appendChild(col);
    });
  }
  const st = $('#bstatus');
  if (spec.pending) {
    // Never show a stale "✓ valid" while the authoritative check is in flight.
    st.innerHTML = `<span style="color:var(--muted)">… проверяю${spec.error ? ' (последняя ошибка: ' + escapeHtml(spec.error) + ')' : ''}</span>`;
  } else if (spec.error) { st.innerHTML = `<span class="err">✗ ${escapeHtml(spec.error)}</span>`; }
  else if (spec.yaml) {
    st.innerHTML = `<span class="ok-line">✓ valid — ${spec.current.tasks.length} task(s), ${(spec.levels || []).length} level(s)</span>`;
    // Yellow, not red: legal when the value is passed via --input at run time,
    // fatal if it never arrives — boot then refuses and repeats these keys.
    if ((spec.warnings || []).length) {
      st.innerHTML += ` <span style="color:#b8860b">⚠ нет значений для ${spec.warnings.map(w => '${inputs.' + escapeHtml(w) + '}').join(', ')} — заполни Inputs или запусти с --input</span>`;
    }
  }
  else { st.innerHTML = '<span style="color:var(--muted)">собери конвейер…</span>'; }
  $('#byaml').textContent = spec.yaml || '—';
}

function specForServer() {
  readMeta();
  const s = JSON.parse(JSON.stringify(spec.current));
  for (const t of s.tasks) { if (t.model === '' ) t.model = null; if (t.out === '') t.out = null; }
  s.tasks = s.tasks.filter(t => (t.id || '').trim());
  return s;
}

function touch() {
  spec.dirty = true;
  spec.pending = true;      // preview shows "checking", never a stale "✓ valid"
  renderPreview();          // instant DAG/level refresh from the last valid plan
  // Repaint the edges now, not on the next full renderCanvas(). Edges follow
  // effDeps (explicit deps + ${steps…} refs), which any edit can change: a
  // dependency checkbox, a harness/model swap, the prompt card. Without this
  // the arrow appeared only after a later re-render (e.g. a click elsewhere) —
  // the owner's report that nodes "update only after some iteration". Cheap:
  // geometry-only, no block rebuild, so the focused input is never disturbed.
  drawEdges();
  validateSoon(500);        // debounce the authoritative check
}

// Save-time gate: the inputs textarea may contain lines that never made it
// into the spec (no '=', empty key). Saving such a flow silently drops the
// inputs — the exact bug that produced a run whose ${inputs.*} resolved to
// nothing. So we refuse to save and name the offending lines.
function inputGateError() {
  const bad = parseInputs.bad || [];
  return bad.length
    ? 'Inputs: строки не распознаны (формат key=value): ' + bad.join(' │ ')
    : null;
}
function validateSoon(ms) {
  clearTimeout(bTimer);
  bTimer = setTimeout(validateNow, ms);
}
async function validateNow() {
  try {
    const res = await post('/api/flows/validate', { flow: specForServer() });
    if (res.ok) {
      spec.levels = res.levels; spec.error = null; spec.yaml = res.yaml;
      // ${inputs.k} with no value in the flow: legal if the value comes from
      // --input at run time, fatal otherwise. Yellow here, red at boot.
      spec.warnings = res.warnings || [];
    } else { spec.error = res.error; spec.levels = null; spec.warnings = []; }
  } catch (e) { spec.error = e.message; }
  spec.pending = false;
  renderPreview();
}

async function saveFlow() {
  const flow = specForServer();   // readMeta() runs inside → parseInputs.bad is fresh
  const gate = inputGateError();
  if (gate) { spec.error = gate; spec.pending = false; renderPreview(); return; }
  try {
    const res = await post('/api/flows/save', { flow });
    spec.yaml = res.yaml; renderPreview();
    note('saved ' + res.path);
    await loadSavedList();
  } catch (e) { note('save failed: ' + e.message); }
}
async function saveAndRun() {
  const flow = specForServer();
  const gate = inputGateError();
  if (gate) { spec.error = gate; spec.pending = false; renderPreview(); return; }
  try {
    const res = await post('/api/flows/boot', { flow });
    note('запущено ' + res.path);
    await loadSavedList();
    await loadRuns(true);
    if (res.run_id) { $('#runsel').value = res.run_id; await selectRun(res.run_id); }
  } catch (e) {
    // Keep the server's refusal in the status bar, not just the 4s note: this
    // is where a missing ${inputs.k} surfaces, and its wording names the keys.
    spec.error = e.message; spec.pending = false; renderPreview();
    note('run failed: ' + e.message);
  }
}

async function loadSavedList() {
  // One source (/api/flows) feeds both the header «Пайплайны» dropdown and the
  // YAML pop-up's «открыть…» — the header list is the primary way to open a
  // pure template; the pop-up keeps its copy so the modal still stands alone.
  try {
    const flows = await api('/api/flows');
    const opts = flows.map(f => ({ value: f.path, text: f.name }));
    for (const [sel, none] of [[$('#flowsel'), '— выбрать пайплайн —'],
                               [$('#b-open'), 'открыть…']]) {
      if (!sel) continue;
      const keep = sel.value;
      sel.innerHTML = '';
      const n = document.createElement('option'); n.value = ''; n.textContent = none;
      sel.appendChild(n);
      for (const o of opts) {
        const el = document.createElement('option');
        el.value = o.value; el.textContent = o.text;
        sel.appendChild(el);
      }
      sel.value = opts.some(o => o.value === keep) ? keep : '';
    }
  } catch (e) { /* non-fatal */ }
}

// Fully detach the canvas from the attached run: close the SSE, drop the run
// id and snapshot, reset the loaded-flow memo and the editor's selection.
// New/Open call this so a same-named task in another flow can never show the
// old run's chat or steer/rerun the old run (F08). Resetting lastLoadedRun
// keeps loadRunFlow able to lay the same run's file out again later.
function detachFromRun() {
  if (state.es) { state.es.close(); state.es = null; }
  sessionStorage.removeItem('zori-attached-run');
  state.runId = null; state.snap = null;
  lastLoadedRun = null;
  spec.fromRunFile = false;
  selId = null;
  deselect();
  $('#runsel').value = '';
  updatePill();
  overlayRun();
  renderRunSection();
}

async function openSaved(path) {
  if (!path) return;
  try {
    const { flow } = await api('/api/flows/open?path=' + encodeURIComponent(path));
    // Leave the run behind first (F08): the chat and steer/rerun must not
    // keep pointing at the previous run through a task that happens to share
    // its id.
    detachFromRun();
    spec.current = normaliseFlow(flow);
    // Not (necessarily) the attached run's file — reruns stay spec-less.
    spec.fromRunFile = false;
    spec.levels = null; spec.error = null; spec.yaml = ''; spec.warnings = [];
    renderBuilder(true);
    validateSoon(0);
  } catch (e) { note('open failed: ' + e.message); }
}
function normaliseFlow(f) {
  const s = {
    name: f.name || '', cwd: f.cwd || null,
    default_timeout_secs: f.default_timeout_secs ?? null,
    inputs: f.inputs || {}, harnesses: f.harnesses || {}, watchdog: f.watchdog, max_parallel: f.max_parallel,
    // flow-level skill wiring — without these Save/Run would silently strip
    // the user's instructions from every flow that carries them
    skills: f.skills || [], skills_dirs: f.skills_dirs || [],
    tasks: (f.tasks || []).map(t => ({
      id: t.id || 'task', harness: t.harness || 'coddy', model: t.model || null,
      in: t.in || '', out: t.out || null, depends_on: t.depends_on || [],
      optional: !!t.optional, cwd: t.cwd, timeout_secs: t.timeout_secs,
      args: t.args, env: t.env, watchdog: t.watchdog,
      skills: t.skills || [],   // per-task skills — same loss class, see above
      // the supermodel chat bound to this block (see Task.chat) — must ride
      // through save/open so the dialogue stays with the block
      chat: t.chat ?? null,
      workspace: t.workspace ?? null,   // task|flow — must ride on rerun-with-fix
      pos: (t.pos && Number.isFinite(t.pos.x) && Number.isFinite(t.pos.y))
           ? { x: t.pos.x, y: t.pos.y } : null,
    })),
  };
  if (!s.tasks.length) s.tasks = [ blankTask('draft') ];
  return s;
}

// ---- model catalogs + deps chips (Конфиг tab) -----------------------------
//
// Live model catalogs per harness, pulled from the server (which pulls them
// from the CLIs themselves — see crate::models). `state` drives the hint
// line: 'ok' shows source + count, 'loading'/'error: …' explain an empty list
// so a dropdown is never silently blank.
const MODELS = {}; // harness -> { models: [], default, source, state }

// ---- model dropdown -------------------------------------------------------
//
// Hand-rolled on purpose: <datalist> is unreliable in Safari — it shows no
// list on focus/click (only Safari's own input history) and filters by prefix
// only — which reads as "the list is empty". This one shows the whole catalog
// on focus, filters by substring, keeps the default model first and marked,
// and supports arrows/Enter/Esc.

let mdOpen = false, mdIndex = 0;

function mdItems() {
  const h = editTask && editTask.harness;
  const cat = h ? MODELS[h] : null;
  if (!cat || cat.state !== 'ok' || !cat.models) return [];
  const q = ($('#tm-model').value || '').trim().toLowerCase();
  const list = cat.models.filter(m => !q || m.toLowerCase().includes(q));
  if (cat.default && list.includes(cat.default))   // default floats to the top
    list.sort((a, b) => (a === cat.default ? -1 : b === cat.default ? 1 : 0));
  return list;
}

function renderModelDrop() {
  const drop = $('#tm-model-drop'); if (!drop) return;
  if (!mdOpen) { drop.classList.add('hidden'); drop.innerHTML = ''; return; }
  const h = editTask && editTask.harness;
  const cat = h ? MODELS[h] : null;
  const items = mdItems();
  drop.innerHTML = '';
  if (!items.length) {
    const d = document.createElement('div'); d.className = 'none';
    d.textContent = (cat && cat.state === 'loading') ? 'загружаю каталог из CLI…'
      : (cat && cat.state !== 'ok' && cat.state) ? String(cat.state)
      : 'не найдено — можно ввести id вручную';
    drop.appendChild(d);
  } else {
    if (mdIndex < 0) mdIndex = 0;
    if (mdIndex >= items.length) mdIndex = items.length - 1;
    const dflt = cat.default;
    items.forEach((m, i) => {
      const d = document.createElement('div');
      d.className = 'mo' + (i === mdIndex ? ' sel' : '');
      d.textContent = m;
      if (dflt && m === dflt) {
        const s = document.createElement('span'); s.className = 'dflt'; s.textContent = '· default';
        d.appendChild(s);
      }
      // keep focus on the input while picking with the pointer
      d.addEventListener('pointerdown', e => e.preventDefault());
      d.addEventListener('click', () => pickModel(m));
      drop.appendChild(d);
    });
  }
  drop.classList.remove('hidden');
}

function openModelDrop() { mdOpen = true; if (mdIndex < 0) mdIndex = 0; renderModelDrop(); }
function closeModelDrop() { mdOpen = false; mdIndex = 0; renderModelDrop(); }
function pickModel(m) {
  $('#tm-model').value = m;
  if (editTask) { editTask.model = m; updateNodeChrome(editTask); updateCfgSummary(); touch(); }
  closeModelDrop();
}

function renderModelHint() {
  const hint = $('#tm-model-hint'); if (!hint) return;
  const h = editTask && editTask.harness;
  const cat = h ? MODELS[h] : null;
  if (!cat || cat.state === 'loading') { hint.textContent = '…'; return; }
  if (cat.state === 'ok') {
    const dflt = cat.default ? ' · default: ' + cat.default : '';
    hint.textContent = cat.models.length + ' из CLI' + dflt + ' · ' + cat.source;
    // Helpful placeholder only — never overwrite the task's own value.
    if (cat.default) $('#tm-model').placeholder = cat.default;
  } else {
    hint.textContent = cat.state;
  }
}

async function loadModels(h, force) {
  if (!h) return;
  const cached = MODELS[h];
  if (cached && !force && (cached.state === 'ok' || cached.state === 'loading')) return;
  MODELS[h] = { state: 'loading' };
  if (editTask && editTask.harness === h) { renderModelDrop(); renderModelHint(); }
  try {
    const r = await api('/api/harnesses/' + encodeURIComponent(h) + '/models' + (force ? '?refresh=1' : ''));
    MODELS[h] = { models: r.models || [], default: r.default || null, source: r.source || '', state: 'ok' };
  } catch (e) {
    MODELS[h] = { models: [], default: null, source: '', state: 'error: ' + (e && e.message || e) };
  }
  if (editTask && editTask.harness === h) { renderModelDrop(); renderModelHint(); }
}

function syncModelSupport() {
  const h = editTask && editTask.harness;
  const info = h ? HARNESS.byId[h] : null;
  const on = info ? !!info.supports_model : true;
  $('#tm-model-wrap').classList.toggle('model-off', !on);
  const mi = $('#tm-model');
  mi.disabled = !on;
  mi.placeholder = on ? 'optional' : 'harness sets it';
  const rb = $('#tm-model-refresh'); if (rb) rb.disabled = !on;
  const hint = $('#tm-model-hint');
  if (hint) hint.style.display = on ? '' : 'none';
  if (on && h) { renderModelHint(); loadModels(h, false); mdIndex = 0; renderModelDrop(); }
  else { closeModelDrop(); if (hint) hint.textContent = ''; }
}

function renderDepBoxes() {
  const box = $('#tm-deps'); box.innerHTML = '';
  const deps = new Set(editTask.depends_on || []);
  const others = spec.current.tasks.filter(o => o !== editTask && (o.id || '').trim());
  if (!others.length) {
    box.innerHTML = '<span style="color:var(--muted);font-size:12px">нет других блоков</span>';
    return;
  }
  for (const o of others) {
    const id = (o.id || '').trim();
    const l = document.createElement('label'); l.className = 'dep';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = deps.has(id);
    cb.addEventListener('change', () => {
      const d = new Set(editTask.depends_on || []);
      cb.checked ? d.add(id) : d.delete(id);
      editTask.depends_on = [...d];
      updateCfgSummary();
      touch();
    });
    l.appendChild(cb); l.appendChild(document.createTextNode(id));
    box.appendChild(l);
  }
}

// The skill checkboxes, mirroring renderDepBoxes. A block's `skills` is a list
// of names; each available skill (built-in + project + global) becomes a
// checkbox carrying its one-line description in the tooltip. Skills already on
// the block that aren't in SKILLS.list (a flow's skills_dirs skill) are still
// listed — checked — so toggling one off never silently drops another. The
// runner is the authority on what resolves; this is the picker.
function renderSkillBoxes() {
  const box = $('#tm-skills'); if (!box) return;
  box.innerHTML = '';
  if (!editTask) return;
  const chosen = new Set(editTask.skills || []);
  const byName = new Map();
  for (const s of SKILLS.list) byName.set(s.name, s);
  // Union: known skills first (in store order), then any already set but
  // unknown (so an author can see and clear them).
  const names = SKILLS.list.map(s => s.name);
  for (const c of chosen) if (!byName.has(c)) names.push(c);
  if (!names.length) {
    box.innerHTML = '<span style="color:var(--muted);font-size:12px">хранилище пусто — добавьте &lt;имя&gt;.md в zori-skills/ или ~/.zori/skills</span>';
    return;
  }
  for (const name of names) {
    const info = byName.get(name);
    const l = document.createElement('label'); l.className = 'dep';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = chosen.has(name);
    if (info && info.description) l.title = info.description;
    cb.addEventListener('change', () => {
      const set = new Set(editTask.skills || []);
      cb.checked ? set.add(name) : set.delete(name);
      editTask.skills = [...set];
      updateCfgSummary();
      touch();
    });
    l.appendChild(cb);
    l.appendChild(document.createTextNode(name));
    if (info && info.source === 'built-in') {
      const tag = document.createElement('span');
      tag.style.cssText = 'color:var(--muted);font-size:10px;margin-left:4px';
      tag.textContent = '★';
      l.appendChild(tag);
    }
    box.appendChild(l);
  }
}

// Repaint just one block's text (no rebuild, so the pop-up stays focused).
function updateNodeChrome(t) {
  const el = editEl || elFor(t.id); if (!el) return;
  const id = (t.id || '').trim();
  el.dataset.id = t.id;
  el.classList.toggle('empty', !id);
  setChatBadge(el, !!t.chat);
  el.querySelector('.bn-id').textContent = id || 'новый блок';
  el.querySelector('.bn-sub').textContent = (t.harness || '') + (t.model ? ' · ' + t.model : '');
  const bi = el.querySelector('.bn-in');
  const txt = (t.in || '').trim().replace(/\s+/g, ' ').slice(0, 90);
  // create the preview line on first keystroke — the console input is the
  // main authoring path now, so the block must grow its preview live
  if (!bi && txt) { const d = document.createElement('div'); d.className = 'bn-in'; el.appendChild(d); }
  if (bi || txt) { const b = bi || el.querySelector('.bn-in'); if (b) b.textContent = txt; }
  drawEdges();
}

// ---- block settings: the collapsible config strip ------------------------
//
// Clicking a block (a click, not a drag) selects it and opens its CHAT —
// one console: the stream (start prompt as the first tinted line, then the
// dialogue) plus the ❯ input at the bottom. The config (название /
// harness / модель / зависимости-чекбоксы / директория) lives in a collapsible
// strip above the chat; the toggle button doubles as the block's one-line
// summary. Edits commit live into the task object (each change repaints the
// block and re-validates); there is no OK/Cancel — Esc or a click on empty
// canvas just drops the selection. The ▸ / ∥ buttons on the block are the
// quick way to grow the graph.

// The config strip: collapsed by default (the chat is the working surface),
// remembered within the page while the owner flips blocks.
let cfgOpen = false;
function setCfg(open) {
  cfgOpen = open;
  $('#icfg').classList.toggle('hidden', !open);
  $('#icfg-arrow').textContent = open ? '▾' : '▸';
}
// The toggle's own label: everything important at a glance while collapsed.
function updateCfgSummary() {
  const el = $('#icfg-sum');
  if (!el || !editTask) { if (el) el.textContent = 'конфиг блока'; return; }
  const t = editTask;
  let s = ((t.id || '').trim() || 'новый блок') + ' · ' + (t.harness || '');
  if (t.model) s += ' · ' + t.model;
  const d = (t.depends_on || []).length;
  if (d) s += ' · ' + d + ' dep' + (d > 1 ? 's' : '');
  const sk = (t.skills || []).length;
  if (sk) s += ' · 🎓 ' + sk + ' skill' + (sk > 1 ? 's' : '');
  if (t.cwd) s += ' · 📁 ' + t.cwd;
  el.textContent = s;
}

// Textareas that grow with their content (capped), so the chat keeps its
// scrollbar for the dialogue, not for the prompt card.
function autogrow(ta, max = 300) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight + 2, max) + 'px';
}

function openEditor(t) {
  leaveChat();
  editTask = t;
  editIndex = spec.current.tasks.indexOf(t);
  editEl = elFor(t.id);
  selectTask(t.id);
  $('#tm-id').value = t.id || '';
  const opts = HARNESS.list.length ? HARNESS.list
    : [{ id: t.harness || 'coddy', supports_model: true }];
  // F10-DOM: build options with DOM APIs — escapeHtml does not escape quotes,
  // so interpolating values into option="..." attributes was unsafe (a harness
  // id with a quote could break out of the attribute).
  const hsel = $('#tm-harness');
  hsel.innerHTML = '';
  for (const h of opts) {
    const o = document.createElement('option');
    o.value = h.id;
    o.textContent = h.id;
    if (h.id === t.harness) o.selected = true;
    hsel.appendChild(o);
  }
  $('#tm-model').value = t.model || '';
  $('#tm-cwd').value = t.cwd || '';
  $('#tm-in').value = t.in || '';
  $('#tm-out').value = t.out || '';
  $('#pc-out').open = !!t.out;   // a saved `out` reveals its section
  $('#tm-optional').checked = !!t.optional;
  const prevErr = $('#tm-cfg-hint'); if (prevErr) prevErr.textContent = '';
  syncModelSupport();
  renderDepBoxes();
  renderSkillBoxes();
  updateCfgSummary();
  renderRunSection();   // builds the console: stream + the right ❯ input
  autogrow($('#tm-out'), 160);
  // A block that carries a supermodel chat opens ON its dialogue: the chat is
  // hard-bound to the node, so reopening the node brings the same conversation
  // back (the SSE 'state' event repopulates the transcript and the per-run
  // draft). The config strip is loaded above; the model-chat CSS hides it while
  // the dialogue shows, so ✕/Esc drops back to the config like any other block.
  if (t.chat) { openChat(t.chat); return; }
  // Otherwise the console input is the entry point — but only when it is the
  // visible one (authoring state, no run): with a run attached the input is the
  // steer composer and stealing focus would fight the reader.
  const tin = $('#tm-in');
  autogrow(tin, 220);
  setTimeout(() => { if (!tin.classList.contains('hidden')) tin.focus(); }, 0);
}

// Drop the selection: the panel returns to its empty-chat resting state.
// Edits were already committed live, so there is nothing to restore.
function deselect() {
  leaveChat();
  editTask = null; editIndex = -1; editEl = null;
  selectTask(null);
  setCfg(false);
  renderRunSection();
}

// Inspector width: drag its left edge; remembered across reloads. The panel
// FLOATS over the canvas now, so its width never re-flows the graph — the
// canvas keeps its full width underneath and no edges need redrawing here.
//
// F07 (kept, re-aimed): the ceiling is computed from the *available container*
// (#bmid) minus 320px of canvas the panel must leave visible — the panel
// floats, but it may not cover the whole floor. On window.resize the ceiling
// is re-evaluated and the panel shrinks if the window no longer fits it; the
// stored width survives for when the window grows back. Below canvas-min +
// panel-min the panel degrades gracefully: it takes only what is left
// (shrinking toward collapse) instead of overflowing the screen.
//
// There is deliberately NO absolute pixel cap: the owner asked to be able to
// drag the panel across half the screen and beyond. The only ceiling is the
// floor's own width minus what the canvas needs to stay grabbable, so on a
// wide window the panel can grow as far as the screen allows.
(function inspectorResize() {
  const ins = $('#inspector'), handle = $('#ins-handle');
  const CANVAS_MIN = 320, PANEL_MIN = 360;
  const avail = () => {
    const bmid = $('#bmid');
    return bmid ? bmid.clientWidth : window.innerWidth;
  };
  // widest the panel may be for a given container width; never more than the
  // container minus the canvas minimum, so 320px of canvas always stay visible
  // (and grabbable to drag the panel back). No absolute cap — a wide window
  // lets the panel grow past half the screen.
  // The container width is passed in (measured once at drag start) rather than
  // read live: a live read makes the ceiling depend on the panel's own size,
  // so widening the panel widens the ceiling — a runaway that pushed it off
  // the right edge of the screen while dragging left.
  const capFor = (a) => Math.max(0, a - CANVAS_MIN);
  const cap = () => capFor(avail());
  const clampTo = (w, c) => Math.max(Math.min(PANEL_MIN, c), Math.min(c, w));
  const clamp = (w) => clampTo(w, cap());
  const apply = () => {
    const c = cap();
    // min-width follows the cap so narrow windows degrade instead of clashing
    ins.style.minWidth = Math.min(PANEL_MIN, c) + 'px';
    ins.style.maxWidth = c + 'px';
    const want = parseInt(localStorage.getItem('zori.insw') || '0', 10);
    ins.style.width = clamp(want >= PANEL_MIN ? want : avail() * 0.46) + 'px';
  };
  apply();
  let drag = null;
  handle.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    apply();   // lock min/max to what fits right now for the duration of the drag
    // freeze the ceiling for the whole gesture, measured before the panel moves
    drag = { startX: e.clientX, startW: ins.getBoundingClientRect().width, cap: cap() };
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', e => {
    if (!drag) return;
    ins.style.width = clampTo(drag.startW + (drag.startX - e.clientX), drag.cap) + 'px';
  });
  const finish = () => {
    if (!drag) return;
    drag = null;
    try { localStorage.setItem('zori.insw', String(Math.round(ins.getBoundingClientRect().width))); } catch (err) { /* private mode */ }
  };
  handle.addEventListener('pointerup', finish);
  handle.addEventListener('pointercancel', () => { drag = null; });
  // F07: shrinking the window must shrink the panel, not overflow the screen.
  // Debounced: resize fires per pixel; the widths only matter at the end.
  let rsT = null;
  window.addEventListener('resize', () => {
    clearTimeout(rsT);
    rsT = setTimeout(apply, 60);
  });
})();

// Config strip: edits flow through to the block live and re-validate (debounced)
$('#tm-id').addEventListener('input', () => { if (editTask) { editTask.id = $('#tm-id').value; updateNodeChrome(editTask); updateCfgSummary(); renderRunSection(); touch(); } });
$('#tm-harness').addEventListener('change', () => { if (editTask) { editTask.harness = $('#tm-harness').value; syncModelSupport(); updateNodeChrome(editTask); updateCfgSummary(); touch(); } });

$('#tm-cwd').addEventListener('input', () => { if (editTask) { editTask.cwd = $('#tm-cwd').value.trim() || null; updateCfgSummary(); touch(); } });
// Model field: own dropdown (Safari's datalist shows nothing on focus)
$('#tm-model').addEventListener('focus', openModelDrop);
$('#tm-model').addEventListener('click', openModelDrop);
$('#tm-model').addEventListener('blur', closeModelDrop);
$('#tm-model').addEventListener('input', () => {
  if (editTask) { editTask.model = $('#tm-model').value.trim() || null; updateNodeChrome(editTask); updateCfgSummary(); touch(); }
  mdIndex = 0; renderModelDrop();   // live substring filter while typing
});
$('#tm-model').addEventListener('keydown', e => {
  if (!mdOpen) return;
  const items = mdItems();
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!items.length) return;
    mdIndex = e.key === 'ArrowDown'
      ? (mdIndex + 1) % items.length
      : (mdIndex - 1 + items.length) % items.length;
    renderModelDrop();
  } else if (e.key === 'Enter' && items.length) {
    e.preventDefault(); pickModel(items[mdIndex]);
  } else if (e.key === 'Escape') {
    e.stopPropagation();   // Esc closes the dropdown first, not the whole selection
    closeModelDrop();
  }
});
$('#tm-model-refresh').addEventListener('click', () => { if (editTask) { loadModels(editTask.harness, true); openModelDrop(); } });
$('#tm-in').addEventListener('input', () => { if (editTask) { editTask.in = $('#tm-in').value; updateNodeChrome(editTask); touch(); } autogrow($('#tm-in'), 220); });
$('#tm-out').addEventListener('input', () => { if (editTask) { editTask.out = $('#tm-out').value.trim() || null; updateNodeChrome(editTask); touch(); } autogrow($('#tm-out'), 160); });
$('#tm-optional').addEventListener('change', () => { if (editTask) { editTask.optional = $('#tm-optional').checked; touch(); } });
$('#tm-del').addEventListener('click', () => { if (!editTask) return; deleteTask(editTask); });

// Canvas panning, Airflow-style: the canvas is an infinite plane under the
// floating panel; dragging the background moves it (translate) and the wheel
// zooms around the cursor. Plain browser-solid mechanics on purpose: the
// move/up listeners live on window and NO pointer capture is used — capture
// on the wrap proved flaky in real Safari (headless Chrome passed, the
// owner's browser did not move at all). A *click* on the empty background —
// pointerdown+up with no drag — drops the selection and the panel returns to
// its empty-chat resting state; a pan never deselects, so sweeping the graph
// around does not close the chat you are reading. Blocks and the zoom pill
// are excluded: blocks drag/select on their own, the pill clicks on its own.
(function canvasPan() {
  let pan = null;
  wrap.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    if (e.target.closest('.bnode') || e.target.closest('#zoomer')) return;
    e.preventDefault();
    pan = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y,
            bg: e.target.id === 'bcanvas' || e.target.id === 'bedges' || e.target.id === 'bcanvas-wrap',
            moved: false };
    wrap.classList.add('panning');
  });
  window.addEventListener('pointermove', e => {
    if (!pan) return;
    const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
    if (!pan.moved && Math.hypot(dx, dy) > 4) pan.moved = true;
    if (pan.moved) { view.x = pan.vx + dx; view.y = pan.vy + dy; applyView(); }
  });
  const finish = e => {
    if (!pan) return;
    const { bg, moved } = pan; pan = null;
    wrap.classList.remove('panning');
    // A plain background click drops the selection. A running chat no longer
    // needs protecting here: it is bound to its node, so this click only detaches
    // it — the transcript is safe and returns when the node is clicked again.
    if (!moved && bg && e.type === 'pointerup') deselect();
  };
  window.addEventListener('pointerup', finish);
  window.addEventListener('pointercancel', () => { pan = null; wrap.classList.remove('panning'); });
})();

// Wheel = zoom around the cursor, no modifier (Airflow's graph view). This
// includes the trackpad pinch (Safari/Chrome send it as ctrl+wheel) — every
// wheel tick is ours, so the page never scrolls instead. Firefox's deltaMode
// "lines" gets a coarser exponent than raw pixels.
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const r = wrap.getBoundingClientRect();
  const f = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015));
  zoomAt(e.clientX - r.left, e.clientY - r.top, f);
}, { passive: false });

// Zoom pill: −/+ step around the center of the free strip, ⤢ fits the graph.
$('#zoom-in').addEventListener('click', () => zoomAt((wrap.clientWidth - $('#inspector').offsetWidth) / 2, wrap.clientHeight / 2, 1.25));
$('#zoom-out').addEventListener('click', () => zoomAt((wrap.clientWidth - $('#inspector').offsetWidth) / 2, wrap.clientHeight / 2, 0.8));
$('#zoom-fit').addEventListener('click', fitView);

(async function initBuilder() {
  try {
    const hs = await api('/api/harnesses');
    HARNESS.list = hs; HARNESS.byId = {}; for (const h of hs) HARNESS.byId[h.id] = h;
    if (!hs.some(h => h.id === 'coddy') && hs.length) { /* default harness fallback */ }
    // The default graph opens its editor BEFORE this fetch resolves, so the
    // harness select would carry the single fallback option (coddy) until the
    // block is re-clicked. Refill the open select in place, keeping the value.
    if (editTask) {
      const hsel = $('#tm-harness'); const cur = hsel.value;
      hsel.innerHTML = '';
      for (const h of HARNESS.list) {
        const o = document.createElement('option');
        o.value = h.id; o.textContent = h.id; if (h.id === cur) o.selected = true;
        hsel.appendChild(o);
      }
      syncModelSupport();
    }
  } catch (e) { /* builder still works, select stays empty */ }
  // The skill picker (node config strip + start-chat) fills from here, fetched
  // once at boot like the harness list. A fetch failure leaves it empty, which
  // is fine: skills are optional and the runner still honours any already set.
  try {
    SKILLS.list = await api('/api/skills');
    if (editTask) renderSkillBoxes();   // the editor may have opened before this resolved
  } catch (e) { /* no picker; existing skills on a block still render their count */ }
  await loadSavedList();
})();

$('#runsel').addEventListener('change', (e) => selectRun(e.target.value));
$('#tm-send').addEventListener('click', steerNode);
$('#tm-rerun').addEventListener('click', rerunNode);   // fix the prompt/config above → rerun carries it
$('#tm-md').addEventListener('click', () => setMd(!mdOn));
$('#tm-md').setAttribute('aria-pressed', String(mdOn));   // reflect the stored MD choice on load
$('#rerunstale').addEventListener('click', rerunStaleAll);
$('#tm-msg').addEventListener('input', () => autogrow($('#tm-msg'), 200));
$('#tm-msg').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.isComposing) return;
  // Chat-like: Enter sends, Shift+Enter is a newline; ⌘/Ctrl+Enter kept.
  if ((e.metaKey || e.ctrlKey) || (!e.shiftKey && !e.altKey)) {
    e.preventDefault();
    if (!$('#tm-msg').disabled) steerNode();
  }
});
// Start-prompt edit-in-place: the stream's first tinted line turns into the
// ❯ textarea right where it sits (fix-and-rerun stays one click away); blur
// or Esc commits it back to a display line. The value was already flowing
// into editTask.in live on input, so "commit" is just the re-render.
$('#start-line').addEventListener('click', () => {
  const line = $('#start-line'), tin = $('#tm-in');
  if (!editTask || line.contains(tin)) return;
  line.innerHTML = '';
  const mark = document.createElement('span'); mark.className = 'cmark'; mark.textContent = '❯';
  const holder = document.createElement('div'); holder.className = 'cbody';
  line.append(mark, holder);
  holder.appendChild(tin);
  tin.classList.remove('hidden');
  autogrow(tin, 260);
  tin.focus();
});
$('#tm-in').addEventListener('blur', () => {
  const line = $('#start-line'), tin = $('#tm-in');
  // Move the textarea HOME first (a detached element can't be found by the
  // $-lookups inside renderRunSection — `remove()` broke it): back into
  // #pane-chat, hidden. renderRunSection keeps the inline editor while the
  // textarea sits in the line (that is how SSE re-renders leave it alone), so
  // the deliberate close must take it out before re-rendering.
  if (line.contains(tin)) {
    tin.classList.add('hidden');
    $('#pane-chat').appendChild(tin);
    renderRunSection();
  }
});
// Startup prompt chooser and a chat session independent of the canvas.
const chatDialog = $('#chat-dialog');
let draftBeforeTyping = '';

function chatStage(stage, title) {
  for (const el of chatDialog.querySelectorAll('[data-stage]')) el.hidden = el.dataset.stage !== stage;
  $('#chat-title').textContent = title;
  $('#chat-error').textContent = '';
}
function promptChoice() {
  if (!editTask || !$('#tm-in').value.trim() || chatDialog.open) return;
  chatStage('mode', 'Как использовать промпт?');
  chatDialog.showModal();
  $('#choose-prompt').focus();
}
$('#choose-prompt').onclick = () => {
  editTask.harness = 'prompt';
  editTask.model = null;
  chatDialog.close();
  openEditor(editTask);
  updateNodeChrome(editTask);
  touch();
};
function chatButton(label, action) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = label; b.onclick = action;
  return b;
}
async function chooseModel() {
  const token = ++chat.request;
  chatStage('models', 'Выберите модель');
  const groups = $('#chat-models');
  groups.textContent = 'Загрузка харнессов…';
  try {
    const harnesses = HARNESS.list.length ? HARNESS.list : await api('/api/harnesses');
    if (token !== chat.request) return;
    groups.replaceChildren();
    for (const h of harnesses.filter(h => h.is_agent && h.supports_model && h.supports_resume)) {
      const group = document.createElement('details');
      const summary = document.createElement('summary');
      summary.textContent = h.id;
      const list = document.createElement('div');
      group.append(summary, list); groups.append(group);
      let loaded = false;
      group.ontoggle = async () => {
        if (!group.open || loaded) return;
        loaded = true;
        list.textContent = 'Загрузка моделей…';
        try {
          const data = await api('/api/harnesses/' + encodeURIComponent(h.id) + '/models');
          if (token !== chat.request) return;
          list.replaceChildren();
          for (const id of data.models) {
            const b = chatButton(id, () => beginChat(h.id, id));
            b.title = data.metadata?.[id]?.description || id;
            list.append(b);
          }
          if (!data.models.length) list.textContent = 'Харнесс не вернул моделей';
        } catch (e) {
          list.textContent = 'Не удалось получить модели: ' + e.message;
          loaded = false; // reopening retries discovery
        }
      };
    }
    const first = groups.querySelector('summary');
    if (first) first.focus(); else groups.textContent = 'Нет харнессов для чата';
  } catch (e) {
    if (token === chat.request) groups.replaceChildren(chatButton('Повторить загрузку', chooseModel));
  }
}
$('#choose-chat').onclick = chooseModel;
async function beginChat(harness, model) {
  if (chat.busy) return;
  const task = editTask;
  const prompt = $('#tm-in').value;
  const previous = draftBeforeTyping;
  chat.busy = true;
  $('#chat-error').textContent = 'Открываю чат…';
  // The planner toggle (default on): when on we send no `skills` and the server
  // attaches both built-in planner skills (zori-config cheat-sheet + zori-planner
  // discipline); when off we send an explicit empty list so the chat runs plain.
  // (Only the chat path uses this; a node's own skills live on the block.)
  const planner = $('#chat-planner');
  const body = { harness, model, prompt };
  if (planner && !planner.checked) body.skills = [];
  try {
    const { run_id } = await post('/api/chats', body);
    if (task && task === editTask && task.in === prompt) {
      task.in = previous;
      $('#tm-in').value = previous;
      updateNodeChrome(task); touch();
    }
    openChat(run_id);
    // Hard-bind the dialogue to the block that started it (see Task.chat), so
    // it reopens there wherever the operator wanders and rides save/open. Mark
    // the flow dirty so the binding is persisted on the next save.
    if (task) { task.chat = run_id; updateNodeChrome(task); touch(); }
    loadRuns(true).catch(e => note(e.message));
  } catch (e) { $('#chat-error').textContent = e.message; }
  finally { chat.busy = false; }
}
function leaveChat() {
  if (!chat.run) return;
  chat.drafts.set(chat.run, $('#tm-msg').value);
  chat.events?.close();
  chat.events = null;
  chat.run = null;
  chat.node = null;
  $('#tm-msg').value = chat.blockDraft;
  autogrow($('#tm-msg'), 200);
  $('#runsel').value = state.runId || '';
  sessionStorage.removeItem('zori-open-chat');
}

function returnToGraph() {
  leaveChat();
  renderRunSection();
  const input = $('#cin textarea:not(.hidden)');
  if (input && !input.disabled) input.focus();
}

function openChat(id) {
  leaveChat();
  if (chatDialog.open) chatDialog.close();
  chat.blockDraft = $('#tm-msg').value;
  chat.run = id;
  chat.node = { id:'chat', status:'pending', harness:'чат' };
  chat.connected = false;
  chat.error = '';
  chat.sending = false;
  sessionStorage.setItem('zori-open-chat', id);
  $('#runsel').value = id;
  $('#tm-msg').value = chat.drafts.get(id) || '';
  renderRunSection();
  autogrow($('#tm-msg'), 200);
  $('#tm-msg').focus();
  const es = new EventSource('/api/runs/' + encodeURIComponent(id) + '/events');
  chat.events = es;
  es.addEventListener('state', event => {
    if (chat.events !== es) return;
    chat.node = JSON.parse(event.data).nodes.chat;
    if (!chat.connected) chat.error = '';
    chat.connected = true;
    renderRunSection();
  });
  es.onerror = () => {
    if (chat.events !== es) return;
    chat.connected = false;
    chat.error = 'Связь прервана, переподключение…';
    renderRunSection();
  };
}

async function sendChat() {
  const id = chat.run, input = $('#tm-msg'), text = input.value;
  if (!text.trim() || $('#tm-send').disabled) return;
  const session = chat.events;
  chat.sending = true;
  chat.error = '';
  $('#tm-send').disabled = true;
  try {
    await post('/api/runs/' + encodeURIComponent(id) + '/steer', {node:'chat', text});
    if (chat.run === id && input.value === text) {
      input.value = '';
      autogrow(input, 200);
    } else if (chat.drafts.get(id) === text) chat.drafts.delete(id);
  } catch (e) {
    if (session === chat.events) chat.error = e.message;
  } finally {
    if (session === chat.events) {
      chat.sending = false;
      renderRunSection();
    }
  }
}
chatDialog.addEventListener('keydown', e => {
  if (e.key === 'Escape') e.stopPropagation();
  if (!['ArrowDown','ArrowUp'].includes(e.key)) return;
  const items = Array.from(chatDialog.querySelectorAll('[data-stage]:not([hidden]) button, [data-stage]:not([hidden]) summary'))
    .filter(el => el.tagName === 'SUMMARY' || !el.closest('details:not([open])'));
  const index = items.indexOf(document.activeElement);
  if (items.length) { e.preventDefault(); items[(index + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); }
});
$('#chat-close').onclick = () => { if (!chat.busy) chatDialog.close(); };
chatDialog.oncancel = e => { if (chat.busy) e.preventDefault(); };
chatDialog.onclose = () => { if (!chatDialog.open) ++chat.request; };

$('#tm-in').addEventListener('focus', () => { draftBeforeTyping = $('#tm-in').value; });
$('#tm-in').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.isComposing && !e.shiftKey && !$('#start-line').contains(e.target) && !state.runId) {
    e.preventDefault();
    if (!e.repeat) promptChoice();
    return;
  }
  if (e.key === 'Escape' && $('#start-line').contains(e.target)) {
    e.stopPropagation();   // Esc here closes the inline editor, not the selection
    const tin = e.target;
    tin.classList.add('hidden');
    $('#pane-chat').appendChild(tin);
    renderRunSection();
  }
});
// (no ↻ refresh button in the header: the run list reloads on every ▶ Run,
// and the attached run streams its own state over SSE)

renderBuilder();   // start on the canvas with one blank block, run detached
applyView();       // identity transform first; a loaded flow fits itself via fitView
openEditor(spec.current.tasks[0]);   // the default graph opens ON its prompt card
const rememberedRun = sessionStorage.getItem('zori-attached-run');
loadRuns(false).then(async () => {
  const previousChat = sessionStorage.getItem('zori-open-chat');
  if (!state.runId && rememberedRun && state.runs.some(r => r.run_id === rememberedRun)) {
    $('#runsel').value = rememberedRun;
    await selectRun(rememberedRun);
  }
  if (previousChat && state.runs.some(r => r.run_id === previousChat && r.chat_title != null)) openChat(previousChat);
});
</script>
</body>
</html>
