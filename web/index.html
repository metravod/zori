<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zori</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c2230; --line: #2a3140;
    --fg: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --pending: #6e7681; --running: #d29922; --done: #3fb950;
    --failed: #f85149; --skipped: #484f58; --stale: #a371f7; --waiting: #e3b341;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 9px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex: 0 0 auto; flex-wrap: wrap;
  }
  /* the top bar: pixel logo + the run-attach controls — the saved-pipeline
     selector, its status pill, rerun-stale — i.e. what you pick and watch.
     The current-pipeline editor (name, default cwd, ＋ block, Save/Run) lives
     in the strip under it (#runbar) — i.e. what you are setting up now */
  #logo { display: flex; align-items: center; gap: 8px; margin: 0 6px 0 0; }
  #logo svg { display: block; width: 60px; height: 20px;
    filter: drop-shadow(0 0 5px rgba(88,166,255,.45)); }
  #logo svg path { fill: var(--accent); }
  #logo .cur { width: 8px; height: 20px; background: var(--accent);
    animation: zblink 1.2s infinite; }   /* hard on/off — a TUI cursor, not a fade */
  @keyframes zblink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #logo .cur { animation: none; } }
  #bf-name { width: 190px; font-weight: 600; }
  #bf-cwd { width: 210px; }
  /* the current-pipeline strip under the logo bar: name, cwd, ＋ block, Save/Run.
     The editor controls are full-size here; it wraps like the header on narrow
     windows so they never overflow */
  #runbar { display: flex; align-items: center; gap: 8px; padding: 6px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex: 0 0 auto; flex-wrap: wrap; }
  #runsel { max-width: 260px; }
  #flowsel { max-width: 240px; }
  /* A labeled dropdown pair in the header: a tiny muted caption glued to its
     select, so "Пайплайны" (pure config templates) and "Раны" (runs with their
     results + chats) read as two distinct lists sitting side by side. */
  .pick { display: inline-flex; align-items: center; gap: 6px; }
  .pick > b { font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
  #rerunstale { font-size: 12px; padding: 3px 9px; }
  #rerunstale[disabled] { display: none; }   /* run actions appear only with a run attached */
  /* ＋ Задача/Промпт — split button with a two-option menu */
  #addblk { position: relative; display: flex; }
  #addblk-main { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  #addblk-caret { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: -1px; padding: 6px 7px; }
  #addblk-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 250px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px;
    box-shadow: 0 10px 28px rgba(0,0,0,.5); }
  #addblk-menu button { display: block; width: 100%; text-align: left; border-color: transparent;
    background: transparent; padding: 6px 10px; border-radius: 6px; }
  #addblk-menu button:hover { border-color: transparent; background: var(--panel2); }
  #addblk-menu button b { display: block; font-size: 13px; }
  #addblk-menu button span { display: block; color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  select, button, input, textarea {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 9px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  /* visible keyboard focus on every control (WCAG 2.4.7). :focus-visible only —
     a mouse click stays clean; Tab lights a ring. The accent outline sits
     outside the 1px border so it never shifts layout. */
  button:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, [tabindex]:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .spacer { flex: 1; }
  .hidden { display: none; }   /* generic; scoped variants below inherit the same effect */
  .pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  main { flex: 1 1 auto; display: flex; min-height: 0; min-width: 0; }

  /* run status lives on the canvas blocks themselves (one view: edit + run) */
  .st-pending { background: var(--pending); }
  .st-running { background: var(--running); animation: pulse 1.1s ease-in-out infinite; }
  .st-done { background: var(--done); }
  .st-failed { background: var(--failed); }
  .st-skipped { background: var(--skipped); }
  .st-stale { background: var(--stale); }
  .st-waiting { background: var(--waiting); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .err { color: var(--failed); font-size: 12px; }
  .ok-line { color: var(--done); font-size: 12px; }
  .hint { color: var(--muted); font-size: 12px; }

  /* ---- the one canvas: build + live run in the same view ---- */
  #build { flex: 1 1 auto; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
  /* Airflow-style: the canvas is the floor — it owns the whole strip under
     the top bars edge to edge, and the inspector floats ON TOP of it instead
     of sitting beside it (the graph never re-flows when the panel opens or
     resizes). The wrap never scrolls natively: the graph is an infinite
     plane moved by a transform (see the `view` state) — drag the background
     to pan, wheel to zoom — so there is nothing to scroll and no scrollbar
     to hide under the panel. flex-basis 0, not auto: the graph's content
     width must never become the shell's min-content (it did — a wide flow
     stretched #bmid past the window: the "graph pushes the panel" the owner
     saw). touch-action:none so touch drags pan instead of being eaten by
     native scroll. */
  #bmid { flex: 1 1 auto; display: flex; min-height: 0; min-width: 0; position: relative; }
  #bcanvas-wrap { flex: 1 1 0; min-width: 0; position: relative; overflow: hidden; cursor: grab;
    touch-action: none;
    background: radial-gradient(circle at 1px 1px, #1a2130 1px, transparent 1.7px) 0 0 / 26px 26px, var(--bg); }
  #bcanvas-wrap.panning { cursor: grabbing; }
  #bcanvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  /* zoom controls: a small floating pill, bottom-left of the floor (bottom-right
     is under the panel). Plain wheel zooms, no modifier (Airflow-style). */
  #zoomer { position: absolute; left: 14px; bottom: 14px; z-index: 5; display: flex; gap: 3px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 5px;
    box-shadow: 0 8px 22px rgba(0,0,0,.4); }
  #zoomer button { width: 26px; padding: 2px 0; border-radius: 999px; font-size: 13px; line-height: 1; }
  #zoom-lvl { font-size: 11px; color: var(--muted); min-width: 34px; text-align: center; user-select: none; }
  #bedges { position: absolute; left: 0; top: 0; pointer-events: none; }
  .bnode {
    position: absolute; width: 184px; min-height: 62px; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: grab;
    user-select: none; transition: border-color .12s, box-shadow .12s;
  }
  .bnode:hover { border-color: #3d465a; }
  .bnode.sel { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(88,166,255,.28); }
  .bnode.bad { border-color: var(--failed); }
  .bnode.dragging { cursor: grabbing; z-index: 5; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .bnode .bn-id { font-weight: 600; font-size: 13px; }
  .bnode .bn-sub { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
  .bnode .bn-in { color: var(--muted); font-size: 11px; margin-top: 4px; max-height: 30px; overflow: hidden; white-space: pre-wrap; word-break: break-word; opacity: .85; }
  .bnode .bn-chat { position: absolute; bottom: 6px; right: 8px; font-size: 11px; line-height: 1; opacity: .8; pointer-events: none; }
  /* Round action buttons on each block: ✕ deletes (top-right corner), ＋ grows
     a dependent block (right edge), ⧉ duplicates (bottom center). They sit on
     the border so they never cover the block's text, and only show on
     hover/selection — a resting canvas stays clean. */
  .bnode .bn-act { position: absolute; width: 22px; height: 22px; padding: 0; z-index: 2;
    border-radius: 50%; background: var(--panel); border: 1px solid var(--line);
    color: var(--muted); font-size: 12px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .12s, color .12s, border-color .12s, background .12s; }
  .bnode:hover .bn-act, .bnode.sel .bn-act { opacity: 1; pointer-events: auto; }
  .bnode .bn-act:hover { color: var(--fg); background: var(--panel2); border-color: var(--accent); }
  .bnode .bn-del { top: -9px; right: -9px; }
  .bnode .bn-del:hover { color: var(--failed); border-color: var(--failed); }
  .bnode .bn-add { right: -11px; top: 50%; transform: translateY(-50%); }
  .bnode .bn-dup { bottom: -9px; left: 50%; transform: translateX(-50%); }
  .bnode .bn-run { left: -11px; top: 50%; transform: translateY(-50%); }
  .bnode .bn-run:hover { color: var(--done); border-color: var(--done); }
  /* in-flight node (the run's driver owns it): ▶ greys out, shows why on hover */
  .bnode .bn-run[disabled]:hover { color: var(--muted); border-color: var(--line); background: var(--panel); }
  .bnode.empty .bn-id { color: var(--muted); font-style: italic; font-weight: 500; }
  .bnode .bn-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .bnode .bn-stat { margin-top: 4px; font-size: 10.5px; color: var(--muted); }
  /* right inspector: FLOATS over the canvas (Airflow-style), so the graph
     keeps the full screen underneath instead of being pushed aside. Inside:
     a collapsible config strip on top, pure chat below. No tabs — YAML moved
     to its own small button (opens a modal) */
  #inspector { position: absolute; top: 0; right: 0; bottom: 0; z-index: 7;
    width: 46%; min-width: 360px; max-width: 660px; display: flex; flex-direction: column;
    border-left: 1px solid var(--line); background: var(--panel);
    box-shadow: -12px 0 28px rgba(0,0,0,.4); }
  #ins-handle { position: absolute; left: -3px; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 6; }
  #ins-handle:hover { background: rgba(88,166,255,.3); }
  .ihead { display: flex; align-items: center; gap: 6px; padding: 6px 10px 0; flex: 0 0 auto; }
  /* the config toggle doubles as the one-line summary of the selected block */
  #icfg-toggle { flex: 1 1 auto; min-width: 0; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 5px 10px; font-size: 13px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #icfg-toggle:hover:not(:disabled) { background: var(--panel2); border-color: var(--line); }
  #icfg-toggle .arr { color: var(--muted); display: inline-block; width: 12px; }
  #iyaml { font-size: 11px; padding: 3px 10px; color: var(--muted); border-radius: 999px; }
  #iyaml:hover { color: var(--fg); }
  .tclose { padding: 2px 10px; font-size: 13px; color: var(--muted); }
  .bstatus { padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; min-height: 33px; flex: 0 0 auto; }
  .ipane { flex: 1 1 auto; min-height: 0; }
  /* collapsible config: название / harness / модель / зависимости (чекбоксы) /
     директория — без шаблонов */
  #icfg { flex: 0 0 auto; max-height: 56%; overflow: auto; border-bottom: 1px solid var(--line); padding: 4px 14px 12px; }
  #icfg.hidden { display: none; }
  #icfg label { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
  #icfg .mrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  #icfg .mrow.full { grid-template-columns: 1fr; }
  #icfg .deps { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 12px; }
  #icfg .dep { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--fg); }
  #icfg .dep input { width: auto; }
  #icfg .opt { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 10px; }
  #icfg .opt input { width: auto; }
  #icfg .pfoot { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
  /* out lives in the config strip now (the console stays pure chat) */
  #icfg .cfgout { margin-top: 10px; }
  #icfg .cfgout summary { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); cursor: pointer; user-select: none; }
  #icfg .cfgout[open] summary { margin-bottom: 4px; }
  #icfg .cfgout textarea { width: 100%; min-height: 40px; margin-top: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  /* levels + YAML live in the YAML modal now (small button, top right) */
  .lvlchips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 10px; }
  .lvlchips .lv { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .lvlchips .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; color: var(--fg); }
  #yamlmodal #byaml { margin: 0; max-height: 52vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); }
  #byaml { margin: 0; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #b6c2cf; white-space: pre-wrap; word-break: break-word; }

  /* pop-up window (flow inputs only — block settings live in the inspector) */
  .modal { position: fixed; inset: 0; background: rgba(3,6,12,.55); display: flex; align-items: flex-start; justify-content: center; z-index: 40; }
  .modal.hidden { display: none; }
  .mbox { margin-top: 6vh; width: 540px; max-width: 94vw; max-height: 86vh; overflow: auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: 0 14px 40px rgba(0,0,0,.5); }
  .mbox h3 { margin: 0 0 10px; font-size: 14px; }
  .mbox label { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
  .mbox .mfoot { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  /* secondary flow ops (open / new / inputs) live in the YAML overview pop-up,
     not in the top bar — the header stays: name, cwd, ＋, Save, Run */
  .ftools { display: flex; gap: 6px; align-items: center; padding: 0 0 10px; }
  .ftools select, .ftools button { font-size: 12px; padding: 3px 9px; color: var(--muted); }
  .ftools #b-open { max-width: 230px; }

  /* ---- chat = ONE console -------------------------------------------------
     The whole panel below the config strip is a single terminal (owner's ask:
     «вся панель — один единый чат, без доп границ, в стиле консоли, на всю
     ширину, сообщения юзера подсвечены, вместо поля ввода — значок»).
     Messages are full-width flat lines, monospace; user lines carry the
     accent tint; the input is a bare ❯ mark in the gutter, no box. */
  #pane-chat { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .cstream { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 8px 0 12px; }
  /* a console line: ❯-gutter + body, full width */
  .cline { display: grid; grid-template-columns: 20px 1fr; column-gap: 8px; align-items: start; padding: 5px 14px; }
  .cline .cmark { color: var(--accent); user-select: none; }
  .cline .cbody { white-space: pre-wrap; word-break: break-word; min-width: 0; }
  .cline .cbody.dim { color: var(--muted); font-style: italic; }
  /* the operator's own lines — starting prompt and steer messages — tinted */
  .cline.user, .turn.human { background: rgba(88,166,255,.09); box-shadow: inset 2px 0 0 var(--accent); }
  #start-line { cursor: text; }
  #start-line:hover { background: rgba(88,166,255,.14); }
  /* run status: one thin dim line at the top of the stream */
  .cline.head { display: flex; align-items: center; gap: 7px; padding: 2px 14px 7px; color: var(--muted); font-size: 11.5px; }
  .cline.head.hidden, .cline.user.hidden { display: none; }
  .cline.head .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  /* borderless inputs inside lines and the composer: the console look */
  .cline textarea, .cin textarea { width: 100%; min-height: 20px; resize: none; overflow: auto;
    background: transparent; border: 0; padding: 0; color: var(--fg); font: inherit; }
  /* the composer and the console lines are meant to read as a terminal prompt,
     not as form fields: keep them borderless and unframed even on focus, so the
     global :focus-visible ring never turns the input into a box (the `❯` marker
     and the caret are the focus cue). The higher-specificity class selector
     here wins over the global textarea:focus-visible rule. */
  .cline textarea:focus, .cin textarea:focus { outline: none; }
  /* dialogue turns: flat, full width, aligned with the cline body column */
  .turns { display: flex; flex-direction: column; gap: 6px; }
  .turn { padding: 4px 14px 4px 42px; white-space: pre-wrap; word-wrap: break-word; font-size: 12.5px; }
  .turn .who { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; opacity: .6; margin-bottom: 2px; }
  .turn.agent { border-left: 2px solid var(--line); margin-left: 14px; }
  .turn.human { padding-left: 42px; }
  .turn.system { color: var(--muted); font-size: 11.5px; border-left: 2px dashed var(--waiting); margin-left: 14px; }
  .turn.agent.empty { color: var(--muted); font-style: italic; }
  .chat-note { margin: 8px 14px; color: var(--muted); font-size: 12px; }
  .chat-note.hidden { display: none; }
  .model-off { opacity: .5; }

  /* model dropdown — hand-rolled: <datalist> shows nothing on focus in Safari
     (and filters by prefix only), so the console ships its own list */
  #tm-model-row { position: relative; display: flex; gap: 6px; align-items: center; }
  .mdrop { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30;
    max-height: 264px; overflow: auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 10px 28px rgba(0,0,0,.45); padding: 4px; }
  .mdrop.hidden { display: none; }
  .mdrop .mo { padding: 5px 9px; border-radius: 6px; cursor: pointer; font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .mdrop .mo:hover, .mdrop .mo.sel { background: var(--panel2); }
  .mdrop .mo .dflt { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; margin-left: 7px; }
  .mdrop .none { padding: 6px 9px; color: var(--muted); font-size: 12px; }

  /* Чат pane — one console (styles live in the console block above); the
     composer is the input line: ❯ + borderless auto-growing textarea */
  .composer { flex: 0 0 auto; border-top: 1px solid var(--line); }
  .composer.hidden { display: none; }
  .cin { display: grid; grid-template-columns: 20px 1fr; column-gap: 8px; align-items: start; padding: 10px 14px 6px; }
  .cin .cmark { color: var(--accent); user-select: none; padding-top: 1px; }
  .cin textarea { max-height: 220px; }
  .cin textarea::placeholder, .cline textarea::placeholder { color: var(--muted); opacity: .75; }
  .cacts { display: flex; gap: 8px; align-items: center; padding: 0 14px 10px; }
  .cacts.hidden { display: none; }
  .cacts .hint { flex: 1 1 auto; min-width: 0; }
  .cline textarea { max-height: 260px; }

  /* Markdown in an agent bubble. The bubble itself stays pre-wrap because the
     raw view (MD off) is the text exactly as the harness printed it; the
     rendered tree switches back to normal flow and owns its own spacing. */
  .turn .md { white-space: normal; }
  .turn .md > :first-child { margin-top: 0; }
  .turn .md > :last-child { margin-bottom: 0; }
  .turn .md p, .turn .md ul, .turn .md ol, .turn .md blockquote,
  .turn .md table, .turn .md pre { margin: 6px 0; }
  .turn .md h1, .turn .md h2, .turn .md h3, .turn .md h4, .turn .md h5, .turn .md h6 {
    margin: 10px 0 5px; line-height: 1.3;
  }
  .turn .md h1 { font-size: 15.5px; }
  .turn .md h2 { font-size: 14.5px; }
  .turn .md h3 { font-size: 13.5px; }
  .turn .md h4, .turn .md h5, .turn .md h6 { font-size: 12.5px; }
  .turn .md ul, .turn .md ol { padding-left: 20px; }
  .turn .md li { margin: 2px 0; }
  .turn .md li.md-task { list-style: none; margin-left: -14px; }
  .turn .md .md-box { opacity: .8; }
  .turn .md blockquote {
    border-left: 3px solid var(--line); padding: 1px 0 1px 9px; color: var(--muted);
  }
  .turn .md code {
    background: #0b0f14; border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 4px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .turn .md pre {
    background: #0b0f14; border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; overflow: auto;
  }
  .turn .md pre code { background: none; border: 0; padding: 0; display: block; white-space: pre; }
  .turn .md pre[data-lang]::before {
    content: attr(data-lang); display: block; font-size: 10px; letter-spacing: .5px;
    text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
  }
  .turn .md table { border-collapse: collapse; font-size: 12px; display: block; overflow-x: auto; }
  .turn .md th, .turn .md td { border: 1px solid var(--line); padding: 3px 7px; text-align: left; }
  .turn .md th { background: var(--panel); }
  .turn .md a { color: var(--accent); }
  .turn .md hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
  #tm-md { font-size: 11px; padding: 3px 7px; }
  #tm-md[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #chat-empty { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); font-size: 12.5px; }
  #chat-empty.hidden { display: none; }
  #tm-questions { flex: 0 0 auto; }
  #inbox { position:relative; color:var(--waiting); }
  #inbox summary { cursor:pointer; }
  #inbox-cards { position:absolute; z-index:60; top:100%; margin-top:8px; background:var(--panel); width:min(360px,80vw); max-height:65vh; overflow:auto; padding:8px; border:1px solid var(--line); border-radius:8px; }
  .question { margin: 6px 14px; padding: 6px 10px; border-left: 2px solid var(--waiting); font-size: 12px; }
  .question strong { display:block; white-space:pre-wrap; overflow-wrap:anywhere; margin:3px 0; }
  .question button { margin:3px; }
  .question input { width:100%; }
  // Proposal card: the server-checked ```zori-flow block the operator launches.
  // The border colour carries the verdict — green runnable, red invalid, grey
  // consumed (launched/rejected) — so status reads at a glance without a label.
  .proposal { margin: 8px 14px; padding: 8px 10px; border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: 6px; background: var(--panel2); font-size: 12px; }
  .proposal.ok { border-left-color: var(--done); }
  .proposal.bad { border-left-color: var(--failed); }
  .proposal.done { border-left-color: var(--muted); opacity: .8; }
  .proposal.rejected { border-left-color: var(--muted); opacity: .6; }
  .proposal .p-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .proposal .p-title { font-weight:600; }
  .proposal .p-badge { font-size:10px; padding:1px 6px; border-radius:8px; color:var(--bg); font-weight:700; }
  .proposal.ok .p-badge { background:var(--done); }
  .proposal.bad .p-badge { background:var(--failed); color:#fff; }
  .proposal.done .p-badge { background:var(--muted); }
  .proposal.rejected .p-badge { background:var(--muted); }
  .proposal pre { margin:6px 0; padding:6px 8px; background:var(--bg); border:1px solid var(--line);
    border-radius:5px; overflow:auto; max-height:240px; font:11px/1.5 var(--mono, monospace); white-space:pre; }
  .proposal .p-err { color:var(--failed); margin:4px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .proposal .p-warn { color:var(--waiting); margin:4px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .proposal .p-lv { color:var(--muted); margin:4px 0; }
  .proposal .p-actions { display:flex; gap:6px; align-items:center; margin-top:6px; flex-wrap:wrap; }
  .proposal .p-actions input { width:120px; }
  .proposal .p-note { color:var(--muted); font-size:11px; margin-left:auto; }
  #chat-dialog { width:min(560px,90vw); max-height:84vh; overflow:auto; color:var(--fg); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  #chat-dialog::backdrop { background:rgba(3,6,12,.65); }
  .chat-top { display:flex; align-items:center; gap:10px; }

</style>

<script type="module">
const $ = (s) => document.querySelector(s);
const COL_W = 250, PAD = 30, GAP = 24;
const state = { runs: [], runId: null, snap: null, es: null };
const chat = { run: null, events: null, node: null, connected: false, error: '', sending: false,
  request: 0, busy: false, blockDraft: '', drafts: new Map() };


// ---- API -----------------------------------------------------------------
async function api(path, opts) {
  const r = await fetch(path, opts);
  const ct = r.headers.get('content-type') || '';
  const body = ct.includes('json') ? await r.json() : await r.text();
  if (!r.ok) throw new Error((body && body.error) || r.status + ' ' + r.statusText);
  return body;
}
const post = (path, obj) => api(path, {
  method: 'POST', headers: { 'content-type': 'application/json' },
  body: JSON.stringify(obj || {}),
});

// ---- Runs: the same canvas, in live mode ------------------------------
//
// Attaching a run (picking it in the header or ▶ Run) loads
// that run's flow ONTO this canvas and paints its live status on the blocks:
// a status dot, a per-block progress line, and — on the inspector's Чат tab
// of the selected block — the dialogue with steer/rerun. Editing is always
// available; the overlay simply disappears when no run is attached, or for
// blocks whose id the run does not know.

let lastLoadedRun = null;   // run whose flow is currently laid out on the canvas

async function loadRuns(keepSel) {
  state.runs = await api('/api/runs');
  const sel = $('#runsel');
  sel.innerHTML = '';
  const none = document.createElement('option');
  none.value = '';
  none.textContent = state.runs.length ? '— editing (no run attached) —' : '— no runs —';
  sel.appendChild(none);
  for (const r of state.runs) {
    const o = document.createElement('option');
    o.value = r.run_id;
    o.textContent = r.chat_title != null ? `Чат · ${r.chat_title}` : `${r.flow_name} · ${r.status} (${r.nodes})`;
    sel.appendChild(o);
  }
  const alive = state.runId && state.runs.some(r => r.run_id === state.runId);
  sel.value = (keepSel && alive) ? state.runId : '';
  if (!alive) clearRun();
  if (chat.run) sel.value = chat.run;
}

function clearRun() {
  if (state.es) { state.es.close(); state.es = null; }
  sessionStorage.removeItem('zori-attached-run');
  state.runId = null; state.snap = null;
  $('#runsel').value = '';
  updatePill();
  overlayRun();
  renderRunSection();
}

async function selectRun(id) {
  if (!id) { leaveChat(); clearRun(); return; }
  if (state.runs.some(r => r.run_id === id && r.chat_title != null)) {
    openChat(id); return;
  }
  leaveChat();
  if (state.es) state.es.close();
  sessionStorage.setItem('zori-attached-run', id);
  state.runId = id;
  try {
    const snap = await api('/api/runs/' + encodeURIComponent(id));
    if (state.runId !== id) return;
    state.snap = snap;
    await loadRunFlow(snap);    // lays the run's flow out on this canvas
  } catch (e) { note('run load failed: ' + e.message); }
  if (state.runId !== id) return;
  updatePill();
  overlayRun();
  renderRunSection();
  const es = new EventSource('/api/runs/' + encodeURIComponent(id) + '/events');
  es.addEventListener('state', (ev) => {
    if (state.runId !== id) return;
    try {
      state.snap = JSON.parse(ev.data);
      overlayRun(); updatePill(); renderRunSection();
    } catch (e) { /* ignore bad frame */ }
  });
  state.es = es;
}

// Put the attached run's flow file on the canvas — once per run, so SSE
// frames and re-attaching never clobber edits in progress. If the file is
// gone (deleted after the run), fall back to the topology the run recorded,
// so the status dots still have their blocks to sit on.
async function loadRunFlow(snap) {
  if (state.runId === lastLoadedRun) return;
  lastLoadedRun = state.runId;
  try {
    const { flow } = await api('/api/flows/open?path=' + encodeURIComponent(snap.flow_path));
    if (state.runId !== snap.run_id) return;
    spec.current = normaliseFlow(flow);
    // The mirror IS the run's spec → a rerun may carry the edited block back.
    spec.fromRunFile = true;
  } catch (e) {
    if (state.runId !== snap.run_id) return;
    spec.current = {
      name: snap.flow_name || '', cwd: null, default_timeout_secs: null,
      inputs: {}, harnesses: {},
      tasks: Object.values(snap.nodes || {}).map(n => ({
        id: n.id, harness: n.harness, model: n.model || null, in: '', out: null,
        depends_on: n.depends_on || [], optional: !!n.optional,
        cwd: null, timeout_secs: null, args: null, env: null, pos: null,
      })),
    };
    // Fallback topology only — its empty prompts must never ride on a rerun.
    spec.fromRunFile = false;
    note('файл flow не открылся — показаны узлы из рана');
  }
  spec.levels = snap.levels || null;
  spec.error = null; spec.yaml = ''; spec.warnings = [];
  renderBuilder(true);
  validateSoon(0);
}

// Paint (or remove) the live status on every block: dot before the id plus a
// progress/result line. Cheap: only touches existing DOM.
function overlayRun() {
  const nodes = (state.snap && state.snap.nodes) || {};
  for (const el of canvas.querySelectorAll('.bnode')) {
    const n = nodes[el.dataset.id];
    const dot = el.querySelector('.bn-dot');
    const stat = el.querySelector('.bn-stat');
    const run = el.querySelector('.bn-run');
    if (!n) {
      if (dot) dot.remove();
      if (stat) stat.remove();
      // no node in the attached run → ▶ starts a focused boot, always allowed
      if (run) run.disabled = false;
      continue;
    }
    // ▶ is the operator's hand on a settled node; a node the driver still owns
    // (in the queue, running, or parked on a question) cannot be re-driven.
    if (run) run.disabled = !['done', 'stale', 'failed', 'skipped'].includes(n.status);
    let d = dot;
    if (!d) {
      d = document.createElement('span');
      d.className = 'bn-dot';
      el.querySelector('.bn-id').prepend(d);
    }
    d.className = 'bn-dot st-' + n.status;
    d.title = labelFor(n.status) + (n.optional ? ' (optional)' : '');
    let s = stat;
    if (!s) { s = document.createElement('div'); s.className = 'bn-stat'; el.appendChild(s); }
    s.textContent = statusMeta(n) || labelFor(n.status);
  }
}

// Keep the same input element while SSE updates progress or another question.
function questionCards(box, nodes, currentRun = () => state.runId) {
  const cards = new Map(Array.from(box.children, el => [el.dataset.key, el]));
  for (const n of nodes) for (const q of n.questions || []) {
    if (q.closed || q.answer != null) continue;
    const run = currentRun();
    const key = JSON.stringify([run, n.id, q.id]);
    if (cards.delete(key)) continue;
    const form = document.createElement('form');
    form.className = 'question'; form.dataset.key = key;
    const label = document.createElement('small');
    label.textContent = n.id + (q.inline ? ' · вопрос по ходу работы' : ' · вопрос оператора');
    const title = document.createElement('strong'); title.textContent = q.text;
    form.append(label, title);
    const input = document.createElement('input');
    input.placeholder = 'Свой ответ'; input.setAttribute('aria-label', q.text);
    const feedback = document.createElement('div');
    feedback.setAttribute('role', 'status');
    async function send(text) {
      if (form.dataset.sending || !text.trim() || currentRun() !== run) return;
      form.dataset.sending = '1';
      try {
        await post('/api/runs/' + encodeURIComponent(run) + '/answer', {
          node: n.id, question_id: q.id, text
        });
        feedback.textContent = 'Ответ принят';
      } catch (e) {
        delete form.dataset.sending;
        feedback.textContent = e.message;
      }
    }
    for (const choice of q.options) {
      const button = document.createElement('button');
      button.type = 'button'; button.textContent = choice;
      button.onclick = () => send(choice); form.append(button);
    }
    const submit = document.createElement('button');
    submit.type = 'submit'; submit.textContent = 'Ответить';
    form.append(input, submit, feedback);
    form.onsubmit = e => { e.preventDefault(); send(input.value.trim()); };
    box.append(form);
  }
  for (const old of cards.values()) old.remove();
}

// The proposal card — the server-checked ```zori-flow block the operator can
// launch. Keyless-diff like questionCards: the card is keyed on [run, node,
// hash], so a NEW proposal block (different hash) replaces the card outright
// (the operator must confirm the graph they actually see — the swap guard the
// server enforces too), while SSE ticks that leave the hash untouched reuse
// the live element and never lose an in-flight "launching…" button. The card
// never launches anything by itself: Run posts /run-proposal and the SERVER
// boots it; the model has no launch authority, only the operator does.
function proposalCards(box, nodes, currentRun = () => state.runId) {
  const cards = new Map(Array.from(box.children, el => [el.dataset.key, el]));
  for (const n of nodes) {
    const p = n.proposal;
    if (!p) continue;
    const run = currentRun();
    const key = JSON.stringify([run, n.id, p.hash]);
    const existing = cards.get(key);
    if (existing) {
      // Reuse the live card, but refresh its status in place (a launch or a
      // server-side fix-round flips status without changing the hash).
      paintProposal(existing, p, n, run);
      cards.delete(key);
      continue;
    }
    const card = document.createElement('div');
    card.className = 'proposal'; card.dataset.key = key;
    card._node = n.id; card._hash = p.hash;
    buildProposalCard(card, p, n, run);
    box.append(card);
    cards.delete(key);
  }
  for (const old of cards.values()) old.remove();
}

// (Re)build the whole interior of a proposal card. Separate from paint so an
// in-place status refresh can rebuild cleanly without disturbing sibling cards.
function buildProposalCard(card, p, n, run) {
  card.textContent = '';
  const head = document.createElement('div'); head.className = 'p-head';
  const title = document.createElement('span'); title.className = 'p-title';
  title.textContent = 'Предложение пайплайна';
  const badge = document.createElement('span'); badge.className = 'p-badge';
  head.append(title, badge);
  card.append(head);

  const pre = document.createElement('pre'); pre.textContent = p.raw || '';
  card.append(pre);

  if (p.errors && p.errors.length) {
    const e = document.createElement('div'); e.className = 'p-err';
    e.textContent = p.errors.join('\n'); card.append(e);
  }
  if (p.warnings && p.warnings.length) {
    const w = document.createElement('div'); w.className = 'p-warn';
    w.textContent = 'нужны значения при запуске: ' + p.warnings.join(', ');
    card.append(w);
  }
  if (p.levels && p.levels.length) {
    const lv = document.createElement('div'); lv.className = 'p-lv';
    lv.textContent = 'уровни: ' + p.levels.map(l => l.join(' + ')).join(' → ');
    card.append(lv);
  }
  const actions = document.createElement('div'); actions.className = 'p-actions';
  card.append(actions);
  paintProposal(card, p, n, run);
}

// Paint the status-dependent parts (badge, actions) of an existing card.
function paintProposal(card, p, n, run) {
  const badge = card.querySelector('.p-badge');
  const actions = card.querySelector('.p-actions');
  card.classList.remove('ok', 'bad', 'done', 'rejected');
  actions.textContent = '';
  const st = p.status || 'proposed';
  if (st === 'proposed' && p.valid) {
    card.classList.add('ok'); badge.textContent = 'готов к запуску';
    // One small input per ${inputs.k} key the graph reads but doesn't declare
    // (the server's warning list), so the operator can supply them at click.
    const fields = {};
    for (const k of (p.warnings || [])) {
      const inp = document.createElement('input');
      inp.placeholder = k; inp.setAttribute('aria-label', 'input ' + k);
      const small = document.createElement('span'); small.textContent = k + ':';
      actions.append(small, inp); fields[k] = inp;
    }
    const runBtn = document.createElement('button');
    runBtn.type = 'button'; runBtn.textContent = '▶ Запустить';
    const note = document.createElement('span'); note.className = 'p-note'; note.setAttribute('role', 'status');
    runBtn.onclick = async () => {
      if (card.dataset.sending) return;
      const inputs = {};
      for (const k in fields) { const v = fields[k].value.trim(); if (v) inputs[k] = v; }
      card.dataset.sending = '1'; runBtn.disabled = true; note.textContent = 'запускаю…';
      try {
        const res = await post('/api/runs/' + encodeURIComponent(run) + '/run-proposal',
          { node: n.id, hash: p.hash, inputs });
        note.textContent = '';
        if (res && res.run_id) {
          const link = document.createElement('button');
          link.type = 'button'; link.textContent = 'открыть ран →';
          link.onclick = () => selectRun(res.run_id);
          actions.append(link);
        }
      } catch (e) {
        delete card.dataset.sending; runBtn.disabled = false; note.textContent = e.message;
      }
    };
    const rej = document.createElement('button');
    rej.type = 'button'; rej.textContent = 'Отклонить';
    rej.onclick = async () => {
      if (card.dataset.sending) return;
      card.dataset.sending = '1';
      try { await post('/api/runs/' + encodeURIComponent(run) + '/reject-proposal', { node: n.id }); }
      catch (e) { delete card.dataset.sending; }
    };
    actions.append(runBtn, rej, note);
  } else if (st === 'proposed') {
    card.classList.add('bad'); badge.textContent = 'не прошло проверку';
    const note = document.createElement('span'); note.className = 'p-note';
    note.textContent = 'zori просит модель исправить';
    actions.append(note);
  } else if (st === 'launched') {
    card.classList.add('done'); badge.textContent = 'запущено';
    if (p.run_id) {
      const link = document.createElement('button');
      link.type = 'button'; link.textContent = 'открыть ран →';
      link.onclick = () => selectRun(p.run_id);
      actions.append(link);
    }
  } else { // rejected
    card.classList.add('rejected'); badge.textContent = 'отклонено';
  }
}

function updatePill() {
  const rs = $('#runstatus');
  const nodes = Object.values(state.snap?.nodes || {});
  const waiting = nodes.reduce((sum, n) => sum + (n.questions || []).filter(q => !q.closed && q.answer == null).length, 0);
  questionCards($('#inbox-cards'), nodes);
  $('#inbox').hidden = waiting === 0;
  $('#inbox summary').textContent = 'Вопросы · ' + waiting;
  if (!state.snap) { rs.textContent = '— editing —'; rs.style.color = 'var(--muted)'; }
  else {
    rs.textContent = state.snap.status;
    rs.style.color = statusColor(state.snap.status);
  }
  // The tab title carries the badge too: an overnight run that parks on a
  // question is visible from another tab without watching the canvas.
  document.title = (waiting ? '❓ ' : '') + 'zori';
  $('#rerunstale').disabled = !state.runId;
}

function statusMeta(n) {
  if (n.status === 'running') {
    const p = n.progress || {};
    const s = p.elapsed_secs ? p.elapsed_secs + 's' : '';
    const b = p.bytes ? (p.bytes > 2048 ? Math.round(p.bytes/1024) + 'k' : p.bytes + 'b') : '';
    return [s, b].filter(Boolean).join(' ') || '…';
  }
  if (n.status === 'done') return n.turns ? (n.turns.length + ' turn' + (n.turns.length>1?'s':'')) : 'ok';
  if (n.status === 'failed') return n.exit_code != null ? 'exit ' + n.exit_code : 'failed';
  return '';
}

// ---- the chat pane of the inspector --------------------------------------
//
// The right panel is PURE CHAT: the selected block's starting prompt is the
// first card of the dialogue, the transcript and composer flow under it, and
// the config (name/harness/model/deps/dir) lives in a collapsible strip above.
// When the attached run knows the selected block's id, the chat also carries
// its live status, dialogue, and the steer/rerun actions; otherwise a slim
// note explains why there is nothing to talk to yet.

// Whether agent answers are rendered as markdown. Remembered across reloads:
// the owner reads the dialogue here, and a stray `*` in someone's log is a
// good reason to want the raw text back for one block.
let mdOn = true;
try { mdOn = localStorage.getItem('zori.md') !== 'off'; } catch (e) { /* private mode: default on */ }
function setMd(on) {
  mdOn = on;
  try { localStorage.setItem('zori.md', on ? 'on' : 'off'); } catch (e) { /* ignore */ }
  $('#tm-md').setAttribute('aria-pressed', String(on));
  renderRunSection();
}

function renderRunSection() {
  // The panel is ONE console (owner's ask): a stream of full-width lines plus
  // a single ❯ input at the bottom. Where the input lives depends on state:
  // no run yet → the console input IS the starting prompt (#tm-in moves into
  // the composer); run attached → the stream shows the start prompt as its
  // first tinted line (click to edit in place) and the input is the steer
  // composer (#tm-msg). The two textareas are nomads: renderRunSection moves
  // them between the composer slot and the start line; their listeners and
  // values live on the elements, so nothing is lost in the move.
  const empty = $('#chat-empty'), noteEl = $('#chat-note');
  const head = $('#run-head'), startLine = $('#start-line');
  const composer = $('#composer'), cin = $('#cin'), cacts = $('#cacts');
  const tin = $('#tm-in'), tmsg = $('#tm-msg');
  const stream = $('#cstream');
  const inChat = !!chat.run;
  $('#inspector').classList.toggle('model-chat', inChat);
  $('#model-chat-heading').hidden = !inChat;
  $('#ins-close').title = inChat ? 'Вернуться к графу (Esc)' : 'Снять выделение (Esc)';
  const n = inChat ? chat.node : state.snap?.nodes?.[editTask?.id?.trim()];
  questionCards($('#tm-questions'), n ? [n] : [], () => chat.run || state.runId);
  proposalCards($('#tm-proposal'), n ? [n] : [], () => chat.run || state.runId);
  if (!n) $('#tm-turns').replaceChildren();
  noteEl.classList.add('hidden');
  head.classList.add('hidden');
  // While the start prompt is being edited in place, the stream must keep the
  // textarea through SSE re-renders (only its own blur/Esc re-renders it away).
  const editingStart = startLine.contains(tin);
  if (!editingStart) startLine.classList.add('hidden');
  if (!editTask && !inChat) {
    empty.classList.remove('hidden');
    empty.textContent = 'кликни блок на канве — его чат появится здесь';
    composer.classList.add('hidden');
    $('#icfg-sum').textContent = 'конфиг блока';
    $('#icfg-toggle').disabled = true;
    return;
  }
  $('#icfg-toggle').disabled = false;
  empty.classList.add('hidden');
  composer.classList.remove('hidden');
  if (!n) {
    // Authoring: nothing to talk to yet — the console input is the start
    // prompt itself; the stream carries only the note about why.
    if (!cin.contains(tin)) cin.appendChild(tin);
    tin.classList.remove('hidden');
    tmsg.classList.add('hidden');
    cacts.classList.add('hidden');
    autogrow(tin, 220);
    noteEl.classList.remove('hidden');
    noteEl.textContent = state.snap
      ? 'в прикреплённом ране нет узла «' + ((editTask.id || '').trim() || 'без id') + '» — чат доступен для блоков этого рана'
      : 'Enter — выбрать стартовый промпт или чат · Shift+Enter — новая строка';
    return;
  }
  // Live chat: input = steer/answer composer.
  if (!cin.contains(tmsg)) cin.appendChild(tmsg);
  tmsg.classList.remove('hidden');
  if (!editingStart) tin.classList.add('hidden');
  cacts.classList.remove('hidden');
  head.classList.remove('hidden');
  $('#tm-run-dot').className = 'dot st-' + n.status;
  const model = n.model ? ' · ' + n.model : '';
  const prog = n.status === 'running' ? ' · ' + (statusMeta(n) || '…') : '';
  $('#tm-run-status').textContent =
    `${labelFor(n.status)} · ${n.harness}${model}${n.optional ? ' · optional' : ''}${prog}`;
  // The starting prompt as the console's first line — tinted like the
  // operator's own words, click to edit it in place (fix-and-rerun lives on).
  if (!editingStart && !inChat) {
    startLine.innerHTML = '';
    const mark = document.createElement('span'); mark.className = 'cmark'; mark.textContent = '❯';
    const body = document.createElement('div'); body.className = 'cbody';
    const txt = (editTask.in || '').trim();
    body.textContent = txt || 'стартовый промпт пуст — нажми, чтобы задать';
    if (!txt) body.classList.add('dim');
    startLine.append(mark, body);
    startLine.classList.remove('hidden');
  }
  // Stick to the newest line only when the reader is already at the bottom —
  // a re-render must not yank somebody up who is reading history. The scroll
  // container is the whole stream now (status/start/turns/questions alike).
  const stick = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 64;
  const turnsBox = $('#tm-turns');
  turnsBox.innerHTML = '';
  const turns = n.turns || [];
  if (!turns.length) turnsBox.innerHTML = '<div class="hint" style="padding:2px 0 2px 42px">диалога пока нет</div>';
  for (const t of turns) {
    const d = document.createElement('div');
    const isAgent = t.role === 'agent';
    const isSystem = t.role === 'system';
    d.className = 'turn ' + (isAgent ? 'agent' : isSystem ? 'system' : 'human') + (isAgent && !t.text ? ' empty' : '');
    // the agent's own answer is markdown; a human turn is what the operator
    // typed, a system turn is the watchdog's own action — both shown exactly
    // as recorded (MD off shows the raw text too)
    const body = (isAgent && mdOn && t.text)
      ? MD.render(t.text)
      : '<div>' + escapeHtml(t.text || '(без текста)') + '</div>';
    d.innerHTML = `<div class="who">${isAgent ? escapeHtml(n.harness) : isSystem ? 'zori' : 'вы'}</div>` + body;
    turnsBox.appendChild(d);
  }
  for (const q of n.questions || []) {
    if (!q.closed && q.answer == null) continue;
    const item = document.createElement('div');
    item.className = 'turn system';
    item.textContent = q.text + '\n' + (q.answer == null ? 'Вопрос закрыт без ответа' : 'Ваш ответ: ' + q.answer);
    turnsBox.append(item);
  }
  if (stick) stream.scrollTop = stream.scrollHeight;
  // A waiting node is answered, not steered: the composer posts to /answer
  // and the parked watchdog loop resumes the session with the text.
  const canAnswer = n.status === 'waiting' && !(n.questions || []).length;
  const canSteer = (n.status === 'done' && !!n.session) || canAnswer;
  // Done/Stale were always re-runnable; Failed is the main reason to (fix the
  // config, try again), Skipped becomes reachable once its deps are done.
  const canRerun = ['done', 'stale', 'failed', 'skipped'].includes(n.status);
  $('#tm-send').disabled = !canSteer || (inChat && (!chat.connected || chat.sending));
  $('#tm-send').textContent = canAnswer ? '✉ Ответить' : inChat ? 'Отправить' : '✉ Send & steer';
  $('#tm-rerun').disabled = !canRerun;
  $('#tm-msg').disabled = !inChat && !canSteer;
  $('#tm-msg').placeholder = canAnswer ? 'ответь на вопрос модели…' : inChat ? 'Сообщение модели' : 'сообщение модели (steer)';
  $('#tm-run-hint').style.color = '';   // a sticky red rerun error clears on re-render
  if (inChat) {
    $('#tm-run-hint').textContent = chat.error || ({
      pending:'Подключение…', running:'Модель отвечает…', waiting:'Модель ждёт ответа',
      failed:n.stderr || 'Ошибка запуска', stale:'Сессия прервана',
    })[n.status] || '';
    return;
  }
  $('#tm-run-hint').textContent = n.status === 'waiting' && !canAnswer ? 'ожидаем ответы на вопросы' : canAnswer ? 'модель ждёт ответа — напиши его ниже, узел продолжится в той же сессии' :
    canSteer ? '' :
    (n.status === 'running' ? 'выполняется — steer станет доступен по завершении'
     : n.status === 'failed' ? 'узел упал — исправь конфиг/промпт и нажми ⟳ Rerun (перезапустит с правками)'
     : n.status === 'skipped' ? 'узел был пропущен (зависимость не завершилась) — ⟳ Rerun запустит его'
     : n.session ? 'из этого состояния steer недоступен' : 'сессия для возврата не записана');
}

// ---- run actions ---------------------------------------------------------
async function steerNode() {
  if (chat.run) return sendChat();
  if (!editTask) return;
  // F08: with no attached run (New/Open detach fully) steering is impossible —
  // never fall back to a leftover runId.
  if (!state.runId) { note('ран не прикреплён — steer недоступен'); return; }
  const id = (editTask.id || '').trim();
  const text = $('#tm-msg').value.trim();
  if (!id || !text) return;
  $('#tm-msg').value = '';
  // A waiting node takes an ANSWER (the parked watchdog loop resumes the
  // session itself); anything else steers as before.
  const n = state.snap && state.snap.nodes ? state.snap.nodes[id] : null;
  const ep = n && n.status === 'waiting' ? 'answer' : 'steer';
  // SSE confirms with the real turn; on failure the text goes back.
  try {
    const snap = await post(`/api/runs/${encodeURIComponent(state.runId)}/${ep}`, { node: id, text });
    state.snap = snap; overlayRun(); renderRunSection();
  } catch (e) { $('#tm-msg').value = text; note(ep + ' failed: ' + e.message); }
}

// Re-run a node from scratch. When the canvas mirror came from the attached
// run's own flow file, the current block config rides along ("rerun with
// fix"): a typo'd model corrected in Конфиг is what actually re-runs. The
// server re-validates (id/deps must match) before applying, so a mirror that
// drifted topologically is rejected with a clear error instead of silently
// running something else.
// Build a rerun body for one node: its id, plus the block's current canvas
// spec when the canvas mirrors the attached run's flow file — so a fix made
// in Конфиг rides along ("rerun with fix"), exactly as the inspector does.
function rerunBodyFor(id) {
  const body = { node: id };
  const mirrorTask = nodeById(id);
  if (mirrorTask && spec.fromRunFile && lastLoadedRun === state.runId) {
    body.task = JSON.parse(JSON.stringify(mirrorTask));
  }
  return body;
}

// Re-run one node of the attached run from scratch. Shared by the inspector's
// ⟳ Rerun (rerunNode) and the block's ▶ button (runNode). Errors are reported
// in the chat hint + status bar and re-thrown so callers can decide.
async function rerunAttached(id) {
  try {
    const snap = await post(`/api/runs/${encodeURIComponent(state.runId)}/rerun`, rerunBodyFor(id));
    state.snap = snap; overlayRun(); renderRunSection();
  } catch (e) {
    const hint = $('#tm-run-hint');
    if (hint) { hint.textContent = '⟳ не вышло: ' + e.message; hint.style.color = 'var(--failed)'; }
    note('rerun failed: ' + e.message);
    throw e;
  }
}

async function rerunNode() {
  if (!editTask) return;
  // F08: rerun needs the attached run; after New/Open there is none until ▶ Run.
  if (!state.runId) { note('ран не прикреплён — rerun недоступен'); return; }
  const id = (editTask.id || '').trim();
  if (!id) return;
  try { await rerunAttached(id); } catch (e) { /* already reported */ }
}

async function rerunStaleAll() {
  if (!state.runId) return;
  try { await post(`/api/runs/${encodeURIComponent(state.runId)}/rerun-stale`); }
  catch (e) { note(e.message); }
}

// The block's ▶ button. Three states, decided by whether this node lives in
// the attached run and what status it has there:
//   • rerunnable (done/stale/failed/skipped) → re-run it in place, same run;
//   • in flight (pending/running/waiting)     → leave it, the run's driver owns it;
//   • not in any run (fresh canvas / just added) → a focused boot that runs
//     only this node plus everything it transitively depends on.
async function runNode(t) {
  const id = (t.id || '').trim();
  if (!id) { note('сначала дай блоку имя'); return; }
  const node = (state.runId && state.snap) ? (state.snap.nodes || {})[id] : null;
  if (node) {
    if (['done', 'stale', 'failed', 'skipped'].includes(node.status)) {
      await rerunAttached(id);
      return;
    }
    // pending/running/waiting: the driver owns this node mid-flight — don't
    // double-drive it. The button is also disabled for these in overlayRun.
    note(node.status === 'running' ? 'узел выполняется — дождись завершения'
      : node.status === 'waiting' ? 'узел ждёт ответа — ответь в чате блока'
      : 'узел уже в очереди этого рана');
    return;
  }
  await focusBoot(id);
}

// Boot a fresh run narrowed to one node and its upstream — the flow is saved
// to --flows-root first (so the rerun can later persist fixes to it), exactly
// like Save → ▶ Run, but with `focus` so only the closure executes.
async function focusBoot(id) {
  const flow = specForServer();
  if (!flow.tasks.some(x => (x.id || '').trim() === id)) { note('узел не сохранён — дай ему имя'); return; }
  const gate = inputGateError();
  if (gate) { spec.error = gate; spec.pending = false; renderPreview(); return; }
  try {
    const res = await post('/api/flows/boot', { flow, focus: id });
    note('запущен фокус на «' + id + '» → ' + res.path);
    await loadSavedList();
    await loadRuns(true);
    if (res.run_id) { $('#runsel').value = res.run_id; await selectRun(res.run_id); }
  } catch (e) {
    spec.error = e.message; spec.pending = false; renderPreview();
    note('focus run failed: ' + e.message);
  }
}
