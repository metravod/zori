# The motivating case: one task, two agents, blind to each other, then a join.
# Each reviewer gets the same prompt from ${inputs.prompt} via a different CLI
# and model; the joiner reads both outputs.
#
# Dry-run first (spends nothing):
#   cargo run -- run examples/issue-planning.yml --dry-run \
#     --input prompt="Review the diff in git status for correctness bugs"
# Then for real:
#   cargo run -- run examples/issue-planning.yml --input prompt="..."
#
# Uses each CLI’s configured default model.
name: issue-planning
cwd: .
default_timeout_secs: 900
# two reviewers in parallel, then the joiner
max_parallel: 2

tasks:
  - id: codex-review
    harness: codex
    in: "${inputs.prompt}"
    out: "Feature development roadmap"

  - id: coddy-review
    harness: coddy
    in: "${inputs.prompt}"
    out: "Feature development roadmap"

  - id: crosscheck
    harness: coddy
    depends_on: [codex-review, coddy-review]
    # consume both upstream outputs — the join. Each reviewer works isolated in
    # its own work dir (${steps.<id>.dir}/work); if a branch wrote files (a
    # roadmap document, notes), they are there, not in the repo.
    in: |
      You are wrapping up the roadmap development for the feature.
      Merge the results of all the other researchers, take the strongest ideas
      from each and form the final roadmap. If a branch wrote files, they lie
      in its working directory: codex — ${steps.codex-review.dir}/work, coddy —
      ${steps.coddy-review.dir}/work.

      ## codex
      ${steps.codex-review.output}

      ## coddy
      ${steps.coddy-review.output}
    out: |
      A roadmap assembled from the ideas gathered by two independent researchers.

  - id: write-comment
    harness: codex
    depends_on: [crosscheck]
    # consume the join
    in: |
      Prepare a draft message for the issue - a confirmation that the user is
      taking this issue to work on and a brief description of how the feature
      will be implemented

      ## Roadmap
      ${steps.crosscheck.output}
    out: |
      A draft issue comment in both Russian and English.
